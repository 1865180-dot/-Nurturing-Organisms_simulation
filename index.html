<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生物育成シミュレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22313a;--sub:#5a6b74;--line:#e2e8ee;--accent:#23905c;--accent2:#176b43;--warn:#e08a1e;--bad:#c0392b;--good:#23905c}
*{box-sizing:border-box}
body{margin:0;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);line-height:1.7;background:linear-gradient(180deg,#a9dcff 0%,#dff1ff 45%,#e5f5dc 100%) fixed;min-height:100vh}
header{background:linear-gradient(90deg,#1f8a57,#2a9fc9);color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 4px 0 rgba(0,0,0,.12);position:sticky;top:0;z-index:5}
header h1{font-size:1.2rem;margin:0;letter-spacing:.06em}
header .who{font-size:.85rem;background:rgba(255,255,255,.22);padding:2px 14px;border-radius:999px}
header .who:empty{display:none}
main{max-width:1040px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 6px 0 rgba(30,60,80,.10),0 10px 24px rgba(30,60,80,.08);animation:pop .35s ease-out both}
h2{font-size:1.25rem;margin:0 0 8px}h3{font-size:1.05rem;margin:12px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.opt{display:block;border:3px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;background:#fff;text-align:left;color:var(--ink);font-weight:normal;width:100%;box-shadow:0 4px 0 var(--line);transition:transform .15s,box-shadow .15s,border-color .15s;letter-spacing:0}
.opt:hover{border-color:#8fd0ad;box-shadow:0 6px 0 #cfe9da;background:#fbfffc;filter:none}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #cfe9da}
.opt.sel{border-color:var(--accent);background:#ecf9f1;box-shadow:0 4px 0 var(--accent)}
.opt.dis{opacity:.55;cursor:not-allowed;background:#f3f3f3;transform:none;box-shadow:none}
.opt b{display:block;margin-bottom:2px;font-size:1.05rem}
.tag{display:inline-block;font-size:.75rem;padding:0 10px;border-radius:999px;background:#e5efe9;color:#3d6450;margin:0 4px 4px 0;font-weight:bold}
.tag.ge{background:#dfeafb;color:#2b4f7a}.tag.gm{background:#f8e2e2;color:#7a2b2b}
button{font:inherit;border:none;border-radius:14px;padding:11px 22px;background:var(--accent);color:#fff;cursor:pointer;font-weight:800;box-shadow:0 5px 0 var(--accent2);transition:transform .1s,box-shadow .1s;letter-spacing:.03em}
button:hover{filter:brightness(1.07)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
button.sub{background:#fff;color:var(--accent);box-shadow:0 5px 0 #bfe3cf;border:2px solid var(--accent)}
button:disabled{background:#b7c2bc;box-shadow:0 5px 0 #98a49d;cursor:not-allowed}
button.big{font-size:1.15rem;padding:14px 34px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{text-align:center;background:linear-gradient(160deg,#ffffff,#effaf3);overflow:hidden}
.hero h2{font-size:1.9rem;color:#1f7a4d;letter-spacing:.08em;margin:6px 0}
.hero .icons{font-size:54px;display:flex;justify-content:center;gap:26px}
.hero .icons span{animation:float 3s ease-in-out infinite;display:inline-block}
.hero .icons span:nth-child(2){animation-delay:.5s}.hero .icons span:nth-child(3){animation-delay:1s}
.simcard{position:relative;overflow:hidden;padding-top:92px;min-height:220px}
.simcard .ico{position:absolute;top:8px;left:14px;font-size:60px;animation:float 3s ease-in-out infinite}
.simcard .band{position:absolute;top:0;left:0;right:0;height:84px;opacity:.16}
.simcard .ico{text-shadow:0 2px 6px rgba(0,0,0,.35)}
.simcard .cnt{position:absolute;top:12px;right:12px;background:#fff;border-radius:999px;padding:0 10px;font-size:.8rem;font-weight:bold;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.scene{border-radius:14px;overflow:hidden;margin-bottom:12px;box-shadow:0 0 0 3px #fff,0 4px 0 3px rgba(0,0,0,.08)}
.scene svg{display:block;width:100%;height:auto}
.hud{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.hud span{background:#fff;border-radius:999px;padding:4px 14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.turnbar{flex:1;min-width:140px;height:14px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px #fff,0 3px 0 rgba(0,0,0,.08)}
.turnbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#ff9f2e);transition:width .8s}
.stat{margin-bottom:9px;font-size:.88rem}
.stat .v{float:right;font-weight:800}
.bar{height:12px;background:#e6edf0;border-radius:999px;overflow:hidden;clear:both}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .8s ease}
.info{background:#eef6fd;border-left:6px solid #4a8fc4;padding:8px 12px;border-radius:10px;margin-bottom:8px;animation:slide .4s both}
.info.w{background:#fff4e2;border-left-color:var(--warn);font-weight:bold;animation:slide .4s both,shake .5s .5s}
.info.w::before{content:"⚠ ";color:var(--warn)}
.log{font-size:.92rem;padding:8px 12px;border-radius:10px;margin:6px 0;background:#f2f6f8;border-left:6px solid #a9bac3;animation:slide .35s both}
.log.bad{background:#fbecea;border-left-color:var(--bad)}
.log.warn{background:#fff3e1;border-left-color:var(--warn)}
.log.good{background:#e8f7ee;border-left-color:var(--good)}
.memo{display:block;font-size:.82rem;color:var(--sub);margin-top:2px}
.dec{margin-bottom:14px}
.dec>b{display:block;margin-bottom:6px}
.dec label{display:inline-block;border:2px solid var(--line);border-radius:12px;padding:7px 14px;margin:0 6px 8px 0;cursor:pointer;background:#fff;box-shadow:0 3px 0 var(--line);transition:transform .1s}
.dec label:hover{border-color:#8fd0ad;background:#fbfffc}
.dec label:has(input:checked){border-color:var(--accent);background:#e7f7ee;box-shadow:0 3px 0 var(--accent);font-weight:bold}
.dec input{accent-color:var(--accent);margin-right:4px}
textarea,input[type=text],select{font:inherit;width:100%;padding:9px;border:2px solid #cbd6dc;border-radius:10px;background:#fff}
textarea{min-height:70px}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #cdeedb}
.count{font-size:.82rem;color:var(--sub);text-align:right}
.count.ng{color:var(--bad);font-weight:bold}
.go{background:radial-gradient(circle at 50% 0,#3d4340,#141716);color:#e8e8e8;border-radius:18px;padding:30px 24px;margin-bottom:16px;animation:darken 1.8s ease both;text-align:center}
.go h2{color:#fff;font-size:1.5rem;letter-spacing:.1em}
.go .memo{color:#c7cfca;font-size:.92rem;text-align:left;max-width:640px;margin:10px auto 0}
.go .cause{font-size:1.15rem;background:rgba(255,255,255,.06);border-radius:12px;padding:12px;max-width:640px;margin:12px auto 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#eef5f1}
.stars{color:#f0a500;font-size:1.25rem;white-space:nowrap}
.stars span{display:inline-block;animation:starpop .5s both}
.stars span.off{color:#d8dde0}
.total{font-size:1.6rem;color:#1f7a4d;font-weight:800;animation:starpop .6s 2.2s both;display:inline-block}
.prog{font-size:.85rem;color:var(--sub)}
footer{text-align:center;color:var(--sub);font-size:.8rem;padding:20px}
.small{font-size:.85rem;color:var(--sub)}
.q{margin-bottom:14px}.q b{display:block}
.pill{display:inline-block;background:#e5efe9;border-radius:999px;padding:3px 12px;margin:3px 6px 3px 0;font-size:.85rem;font-weight:bold}
.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.banner div{background:#fff;padding:16px 46px;border-radius:22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.18);animation:banner 1.4s cubic-bezier(.2,.8,.3,1) both;border:4px solid var(--c,#23905c)}
.banner b{display:block;font-size:2rem;color:var(--c,#23905c);line-height:1.3}
.banner small{font-size:1rem;color:var(--sub)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes banner{0%{transform:translateX(-110vw) skewX(-12deg)}22%{transform:translateX(0) skewX(0)}72%{transform:translateX(0);opacity:1}100%{transform:translateX(110vw) skewX(12deg);opacity:0}}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes starpop{0%{transform:scale(0) rotate(-120deg);opacity:0}70%{transform:scale(1.5)}100%{transform:scale(1);opacity:1}}
@keyframes darken{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.sw{animation:swim var(--d,6s) ease-in-out infinite alternate}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(var(--x,50px))}}
.sway{animation:sway 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.rain line{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(4px,-40px)}to{transform:translate(-4px,40px)}}
.snow circle{animation:snow 4s linear infinite}
@keyframes snow{from{transform:translateY(-30px)}to{transform:translateY(190px)}}
.spin{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.15)}}
.peck{animation:peck 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 100%}
@keyframes peck{0%,55%,100%{transform:rotate(0)}65%,85%{transform:rotate(22deg)}}
.bub{animation:bub 3s linear infinite}
@keyframes bub{from{transform:translateY(0);opacity:.8}to{transform:translateY(-110px);opacity:0}}
.cloud{animation:cloud 18s linear infinite alternate}
@keyframes cloud{to{transform:translateX(40px)}}
.stage{text-align:center}
.stagescene{position:relative;max-width:620px;margin:0 auto}
.stagescene .scene{margin:0}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:14px}
.fl{position:absolute;font-weight:800;font-size:1.2rem;padding:2px 14px;border-radius:999px;background:#fff;white-space:nowrap;animation:floatup 2.6s ease-out both}
.fl.g{color:#1a8a4d;box-shadow:0 0 0 3px #7fd9a4,0 4px 10px rgba(0,0,0,.2)}.fl.b{color:#c0392b;box-shadow:0 0 0 3px #f2a39b,0 4px 10px rgba(0,0,0,.2)}.fl.n{color:#2b6fa8;box-shadow:0 0 0 3px #9cc8ef,0 4px 10px rgba(0,0,0,.2)}
@keyframes floatup{0%{opacity:0;transform:translateY(24px) scale(.5)}15%{opacity:1;transform:translateY(0) scale(1.2)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:none}20%{transform:translate(-9px,3px)}40%{transform:translate(8px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,0)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:flash .6s both;border-radius:14px}
@keyframes flash{from{opacity:.55}to{opacity:0}}
.rpg{max-width:720px;margin:18px auto 0;background:#1d2a4a;color:#fff;border:4px solid #fff;outline:3px solid #1d2a4a;border-radius:14px;padding:18px 20px 22px;text-align:left;min-height:130px;cursor:pointer;position:relative;box-shadow:0 8px 0 rgba(0,0,0,.2);user-select:none}
.rpg .tagn{position:absolute;top:-17px;left:16px;background:#ffd34d;color:#1d2a4a;font-weight:800;padding:0 12px;border-radius:8px;font-size:.85rem}
.rpg .pg{position:absolute;top:-17px;right:16px;background:#fff;color:#1d2a4a;font-weight:800;padding:0 10px;border-radius:8px;font-size:.8rem}
.rpgtxt{font-size:1.15rem;min-height:1.7em}
.rpgtxt.bad{color:#ffb4aa}.rpgtxt.good{color:#a8f0c4}.rpgtxt.warn{color:#ffe0a3}.rpgtxt.me{color:#cfe3ff}
.rpgmemo{font-size:.9rem;color:#c9d3e8;margin-top:6px}
.arrow{position:absolute;right:16px;bottom:6px;animation:blink 1s steps(2) infinite;visibility:hidden}
@keyframes blink{50%{opacity:0}}
.chips{margin-top:12px;min-height:34px}.chip{display:inline-block;margin:3px;padding:2px 12px;border-radius:999px;font-weight:bold;font-size:.9rem;background:#eef3f5;animation:starpop .4s both}
.chip.g{background:#e3f6ea;color:#1a8a4d}.chip.b{background:#fbe6e3;color:#c0392b}.chip.n{background:#e5f0fb;color:#2b6fa8}
.blackout{position:fixed;inset:0;background:#000;z-index:70;animation:bo 1.3s forwards;pointer-events:none}
@keyframes bo{from{opacity:0}to{opacity:1}}
.sndbtn{background:rgba(255,255,255,.22);box-shadow:none;padding:3px 12px;font-size:.85rem;border-radius:999px}
.sndbtn:active{transform:none;box-shadow:none}
.hdr{display:flex;gap:8px;align-items:center}
.hint{display:block;font-size:.74rem;color:#8a6d1e;font-weight:normal;line-height:1.3}
.costbox{background:#fffbea;border:2px dashed #e5c46b;border-radius:12px;padding:10px 14px;margin:4px 0 14px;font-size:.88rem}
.costbox td,.costbox th{border:none;padding:2px 6px}
td.yen{text-align:right;white-space:nowrap}tr.sum td{font-weight:800;border-top:2px solid #e5c46b}
.rpgtxt.money{color:#ffe27a}.log.money{background:#fffbea;border-left-color:#e5c46b}.log.me{background:#e8f0fb;border-left-color:#4a8fc4}
.mchip{background:#fff7d6!important;color:#8a5a00}.mchip.neg{background:#fde3df!important;color:#c0392b}
.moneybox{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:#fff7d6;border:3px solid #f0c64a;border-radius:999px;padding:6px 20px;margin-top:10px;font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 #f0d78a}
.moneybox b{font-size:1.35rem;color:#8a5a00;min-width:7em;display:inline-block}.moneybox b.neg{color:#c0392b}.moneybox b.pos{color:#1a8a4d}.moneybox b.bump{animation:starpop .4s}
.md{font-size:1rem;padding:0 10px;border-radius:999px}.md.g{color:#1a8a4d;background:#e3f6ea}.md.b{color:#c0392b;background:#fbe6e3}
.evcard{text-align:center;border:4px solid #f0c64a;background:linear-gradient(180deg,#fffbea,#fff)}
.evhead{display:inline-block;background:#e08a1e;color:#fff;font-weight:800;padding:2px 18px;border-radius:999px;animation:shake .5s .3s}
.evicon{font-size:72px;line-height:1.2;animation:starpop .6s both}
.evcard .grid{text-align:left;max-width:720px;margin:0 auto}
.evcard .mods{justify-content:center;margin:12px 0 0}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.modchip{background:#fff;border:2px solid #f0c64a;border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:bold}
.modchip small{margin-left:6px;color:var(--sub);font-weight:normal}
.rankcard{text-align:center;background:linear-gradient(160deg,#fffdf2,#fff)}
.rank{font-size:2.1rem;font-weight:800;color:#b07800;animation:starpop .8s 2s both;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.badge{position:relative;background:#f1f3f4;border-radius:14px;padding:10px 6px;text-align:center;color:#9aa4a9;font-size:.8rem;line-height:1.35}
.badge span{display:block;font-size:30px;filter:grayscale(1);opacity:.5}.badge b{display:block;font-size:.85rem}.badge small{display:block;font-size:.7rem}
.badge.got{background:linear-gradient(160deg,#fff6d0,#ffe9a8);color:#6b4b00;box-shadow:0 3px 0 #e8c75a}.badge.got span{filter:none;opacity:1}
.badge.new{animation:starpop .6s both}.badge i{position:absolute;top:-8px;right:-4px;background:#e0362c;color:#fff;font-style:normal;font-weight:800;border-radius:999px;padding:0 8px;font-size:.7rem}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.zcard{background:#f6fbf8;border:2px solid #cfe9da;border-radius:12px;padding:10px;font-size:.85rem}.zcard b{color:#1f7a4d}.zcard p{margin:4px 0 0;color:var(--sub)}
.zcard.lock{display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:#c3ccd0;background:#f1f3f4;border-style:dashed;min-height:70px}
.toast{position:fixed;right:16px;bottom:16px;z-index:80;background:#1d2a4a;color:#fff;border-radius:14px;padding:10px 16px;font-weight:bold;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:slide .3s both}
.toast small{color:#c9d3e8;font-weight:normal}
.photo{position:relative;aspect-ratio:16/9;background-size:118%;background-position:50% 50%;animation:kb 24s ease-in-out infinite alternate;overflow:hidden}
@keyframes kb{from{background-position:42% 45%}to{background-position:58% 55%}}
.photo .tint,.photo svg{position:absolute;inset:0;width:100%;height:100%}
.photo.shakeb{animation:kb 24s ease-in-out infinite alternate,hit 1.2s infinite}
.pchips{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:4px}
.pchips span{background:rgba(255,255,255,.9);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:bold;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.oimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:8px;display:block}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ===== 技術ガチャ・大勝負・トレードオフ ===== */
.gbox{text-align:center}
.gm{position:relative;width:240px;height:300px;margin:6px auto}
.gm-dome{position:absolute;left:20px;top:0;width:200px;height:170px;border-radius:100px 100px 20px 20px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(200,230,255,.55) 40%,rgba(150,200,240,.5));border:5px solid #e04a4a;overflow:hidden}
.gm-dome i{position:absolute;left:var(--x);top:var(--y);width:46px;height:46px;border-radius:50%;background:linear-gradient(var(--c) 50%,#fff 50%);border:2px solid rgba(0,0,0,.15);transform:translate(-50%,-50%)}
.gm-body{position:absolute;left:10px;top:160px;width:220px;height:130px;background:linear-gradient(#ff6a6a,#d63a3a);border-radius:14px;box-shadow:0 8px 0 #9a2412}
.gm-handle{position:absolute;left:24px;top:30px;width:64px;height:64px;border-radius:50%;background:#fff;border:6px solid #9a2412;font-size:38px;color:#d63a3a;display:flex;align-items:center;justify-content:center;font-weight:800;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
.gm-handle.turn{transform:rotate(540deg)}
.gm-out{position:absolute;right:22px;top:40px;width:80px;height:70px;background:#5a1a1a;border-radius:10px 10px 30px 30px}
.cap{position:absolute;left:145px;top:150px;width:64px;height:64px;opacity:0;z-index:2}
.cap .ct2,.cap .cb2{position:absolute;left:0;width:64px;height:32px;border:3px solid rgba(0,0,0,.2)}
.cap .ct2{top:0;border-radius:32px 32px 0 0;background:#eee;transform-origin:10% 100%;transition:transform .5s}
.cap .cb2{top:32px;border-radius:0 0 32px 32px;background:#fff}
.cap.c-silver .ct2{background:linear-gradient(135deg,#fff,#b8c2cc 50%,#8a96a3)}
.cap.c-gold .ct2{background:linear-gradient(135deg,#fff6c2,#ffd34d 45%,#c98a00)}.cap.c-gold{filter:drop-shadow(0 0 10px #ffd34d)}
.cap.c-rainbow .ct2{background:conic-gradient(#ff4d4d,#ffb84d,#ffe24d,#4dd17a,#4da6ff,#a64dff,#ff4d4d)}.cap.c-rainbow{filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 22px #ff8ad8)}
.cap.drop{animation:capdrop 1s cubic-bezier(.3,1.4,.5,1) forwards}
.cap.shake{animation:capshake .25s ease-in-out infinite;opacity:1;top:225px;left:120px}
.cap.open{animation:none;opacity:1;top:225px;left:120px}.cap.open .ct2{transform:rotate(-120deg)}

<body>
<header><h1>🌱 生物育成シミュレーター</h1><div class="hdr"><div class="who" id="who"></div><button class="sndbtn" id="snd" type="button">🔇 効果音オフ</button></div></header>
<main id="app"></main>
<footer>生物育成シミュレーター ver.1.0 ／ 数値は教科書・農林水産省の資料などをもとにした学習用の目安です。<br>© Irie Kanji</footer>

<script>
const IP=n=>"images/"+n+".jpg";
/* ===== 設定：先生用 =====
   Google Apps Script のウェブアプリURLを '' の中に貼り付けてください。
   （URLの末尾に ?gas=URL を付けて開いても設定できます） */
const GAS_URL = 'https://script.google.com/a/macros/fuku-c.ed.jp/s/AKfycbz1UhknPTwIbp4X1SKVapY20HcQvc-wqbvM9AIvK74_iN1PgoVwjJ_uuVfBCLwdLgKkLQ/exec';

/* ===== 共通 ===== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const yen=v=>(v<0?'−':'')+Math.round(Math.abs(v)).toLocaleString()+'円';
function rngFrom(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const step5=(v,th)=>{for(let i=0;i<th.length;i++)if(v>=th[i])return 5-i;return 1;};
const WAGE=1100;
function payCosts(s,C,append){let y=0,h=0;s.book=s.book||{};C.forEach(([n,yv,hr])=>{y+=yv;h+=hr;const k=n.replace(/（.*?）/g,'');if(yv)s.book[k]=(s.book[k]||0)+yv;});const lab=h*WAGE;s.book['人件費']=(s.book['人件費']||0)+lab;s.cost+=y+lab;s.hours=(s.hours||0)+h;if(append&&s.lastPay){s.lastPay.y+=y;s.lastPay.h+=h;s.lastPay.C.push(...C);}else s.lastPay={y,h,C};}
const money=(S,s)=>S.capital-s.cost+(s.sales||0)+(s.extra||0);
function M(s,k){let v=1;(s.mods||[]).forEach(m=>{if(m.k===k&&s.now>=m.from&&s.now<=m.until)v*=m.v;});return v;}
function addMod(s,k,v,turns,label){(s.mods=s.mods||[]).push({k,v,from:s.now||0,until:turns>=99?999:(s.now||0)+turns-1,label});}
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);

const TECH_TABLE=`<table><tr><th></th><th>品種改良（交配・選抜）</th><th>遺伝子組換え</th><th>ゲノム編集</th></tr>
<tr><th>方法</th><td>望ましい性質をもつ個体どうしを交配し、よいものを選ぶことをくり返す</td><td>ほかの生物の遺伝子を組み込む</td><td>生物がもともと持つ遺伝子の決まった場所を変える（働かなくするなど）</td></tr>
<tr><th>時間</th><td>長い（数年〜数十年）</td><td>比較的短い</td><td>短い</td></tr>
<tr><th>国のルール</th><td>特別な手続きはない</td><td>安全性の審査が必要。食品には表示の義務がある</td><td>外から入れた遺伝子が残らないものは、国への届出が必要（表示の義務はない）</td></tr>
<tr><th>例</th><td>多くの野菜・家畜、選抜育種したマダイ</td><td>海外から輸入される大豆・トウモロコシ（油や飼料などの原料）</td><td>GABA高蓄積トマト、可食部増量マダイ</td></tr></table>`;

/* ===== ミニトマト ===== */
const TOMATO={
 id:'tomato',name:'ミニトマトの栽培',cat:'作物の栽培',turns:14,color:'#a8402f',
 intro:'畑で100株のミニトマトを、5月の植え付けから8月まで育てます。1ターンは1週間です。7月から収穫が始まります。',
 label:t=>['5月2週','5月3週','5月4週','6月1週','6月2週','6月3週','6月4週','7月1週','7月2週','7月3週','7月4週','8月1週','8月2週','8月3週'][t],
 setup:[
  {key:'breed',title:'品種を選ぶ',tech:true,options:[
   {id:'tasyu',label:'多収品種',tags:['品種改良'],desc:'たくさんの実がつくように、交配と選抜をくり返して作られた品種。'},
   {id:'kotoudo',label:'高糖度品種',tags:['品種改良'],desc:'甘さを重視して改良した品種。収量はやや少なく、水分が急に増えると実が割れやすい。'},
   {id:'teikou',label:'病気に強い品種（接ぎ木苗）',tags:['品種改良','接ぎ木'],desc:'病気に強い品種を台木にした苗。苗代は高いが、病気に強い。'},
   {id:'gaba',label:'GABA高蓄積トマト',tags:['ゲノム編集'],desc:'ゲノム編集で、血圧の上昇をおさえる成分GABAを多くふくむようにした品種。国に届け出て販売されている。'},
   {id:'gm',label:'遺伝子組換えトマト',tags:['遺伝子組換え'],disabled:true,desc:'日本ではトマトの遺伝子組換え作物は商業栽培されていないため、選べません。'}]},
  {key:'soil',title:'土づくり',options:[
   {id:'taihi',label:'堆肥を入れてよく耕す',desc:'土の中の微生物の働きで土の粒が集まり、団粒構造になる。水はけ・水もち・通気性がよい。'},
   {id:'kagaku',label:'化学肥料だけ入れて耕す',desc:'粒がばらばらの単粒構造のまま。雨が続くと水がたまりやすく、乾くと固くなる。'},
   {id:'none',label:'耕さずにそのまま植える',desc:'固い土のまま。根が広がりにくく、水はけも水もちも悪い。'}]},
  {key:'lime',title:'土の酸度（pH）の調整',options:[
   {id:'yes',label:'苦土石灰でpH6.0〜6.5に調整する',desc:'トマトに適した弱酸性にする。実の育ちに必要なカルシウムも補える。'},
   {id:'no',label:'調整しない（pH5.0の酸性の土）',desc:'日本の土は雨によって酸性になりやすい。'}]},
  {key:'base',title:'元肥（肥料の3要素）',options:[
   {id:'balance',label:'窒素・リン酸・カリを同じ割合で',desc:'8-8-8の肥料。基本的な配合。'},
   {id:'nmany',label:'窒素を多めに',desc:'16-8-8の肥料。葉や茎はよく育つが、育ちすぎると実がつきにくい（つるぼけ）。'},
   {id:'none',label:'元肥なし',desc:'肥料代はかからないが、最初の養分が少ない。'}]}],
 decisions(s,t){return[
  {key:'water',label:'水やり',type:'radio',def:'mid',options:[['none','なし'],['low','控えめ｜⏱1時間'],['mid','適量｜⏱2時間'],['high','多め｜⏱3時間']]},
  {key:'fert',label:'追肥',type:'radio',def:'none',options:[['none','しない'],['n','窒素中心｜💰2,500円 ⏱1時間'],['pk','リン酸・カリ中心｜💰3,000円 ⏱1時間'],['bal','バランスよく｜💰3,500円 ⏱1時間']]},
  {key:'work',label:'作業（1週間に2つまで）',type:'check',max:2,options:[['wakime','わき芽かき｜⏱3時間'],['yuin','支柱立て・誘引｜⏱3時間（最初は支柱代1万円）'],['tekishin','摘心（先端を止める）｜⏱1時間'],['mimawari','見回り・病害虫の防除｜⏱2時間（防除すると農薬代4,000円）']]}];},
 costs(s,d,t,c){const W=d.work||[],C=[];const wh={none:0,low:1,mid:2,high:3}[d.water];
  if(wh)C.push(['水やり（水道代）',{low:200,mid:400,high:600}[d.water],wh*M(s,'water')]);
  if(d.fert!=='none')C.push(['追肥の肥料代',Math.round({n:2500,pk:3000,bal:3500}[d.fert]*M(s,'material')),1]);
  if(W.includes('wakime'))C.push(['わき芽かき',0,3]);
  if(W.includes('yuin'))C.push([s.staked?'誘引':'支柱代・支柱立て',s.staked?0:Math.round(10000*M(s,'material')),3]);
  if(W.includes('tekishin'))C.push(['摘心',0,1]);
  if(W.includes('mimawari'))C.push([(s.pest>0||s.dis>=1)?'見回り・防除（農薬代）':'見回り',(s.pest>0||s.dis>=1)?Math.round(4000*M(s,'material')):0,2*M(s,'spray')]);
  return C.map(x=>[x[0],Math.round(x[1]*M(s,'scale')),r1(x[2]*M(s,'scale'))]);},
 genW(t,rng){const x=rng();
  if(t<=2)return x<.3?'rain':'sunny';
  if(t<=8)return x<.5?'longrain':x<.75?'rain':'sunny';
  if(t<=10)return x<.45?'heat':'sunny';
  return x<.4?'heat':x<.65?'typhoon':'sunny';},
 init(c,rng){
  const W=[];for(let t=0;t<14;t++)W.push(this.genW(t,rng));
  const A=[];for(let t=0;t<14;t++)A.push(t>=1&&t<=7&&rng()<.4);
  let cost={tasyu:8000,kotoudo:10000,teikou:25000,gaba:20000}[c.breed]+{taihi:15000,kagaku:8000,none:0}[c.soil]+(c.lime==='yes'?3000:0)+{balance:4000,nmany:5000,none:0}[c.base];
  const book={'苗・土づくり・元肥':cost,'人件費':8*WAGE};cost+=8*WAGE;
  return{book,hours:8,sales:0,W,A,moist:55,N:{balance:55,nmany:88,none:25}[c.base],PK:{balance:55,nmany:50,none:25}[c.base],health:100,shoots:0,staked:false,yuinLast:-9,pest:0,dis:0,tekishin:-1,harvest:0,sugarSum:0,sugarKg:0,sq:{taihi:1,kagaku:.6,none:.45}[c.soil],fertN:0,pestN:0,leach:0,cost,hist:[]};},
 wname:{sunny:'晴れ',rain:'雨',longrain:'長雨（梅雨）',heat:'猛暑（35℃前後）',typhoon:'台風接近'},
 info(s,t){const L=[{type:'n',msg:`今週の天気予報：${this.wname[s.W[t]]}`}];
  if(s.W[t]==='typhoon')L.push({type:'w',msg:'強い風が予想されます。株が倒れないよう備えが必要です。'});
  if(s.pest>0)L.push({type:'w',msg:'葉の裏にアブラムシが見られます。'});
  if(s.dis>=2)L.push({type:'w',msg:'葉に茶色い斑点が出ている株があります。'});
  if(t===6)L.push({type:'n',msg:'第1花房の実が色づき始めました。来週から収穫が始まります。'});
  if(t>=9&&s.tekishin<0)L.push({type:'n',msg:'収穫期の後半です。摘心をすると、残りの実に養分を集中できます。'});
  return L;},
 status(s){return[['株の元気',s.health,'%'],['土の水分',s.moist,'',[30,75]],['窒素（N）',s.N,'',[20,75]],['リン酸・カリ（P・K）',s.PK,'',[20,100]],['わき芽',s.shoots,'本分',null,true],['累計収穫量',r1(s.harvest),'kg',null,true]];},
 step(s,d,t,rng,c){
  const L=[],add=(type,msg,memo)=>L.push({type,msg,memo});const w=s.W[t],W=d.work||[];let ff=1;const prevM=s.moist;payCosts(s,this.costs(s,d,t,c));
  // 水分
  s.moist+={none:0,low:10,mid:25,high:40}[d.water];
  const wv={sunny:-25,rain:15,longrain:35,heat:-40,typhoon:30}[w];
  s.moist+=wv<0?wv*(1.25-.25*s.sq):wv;
  if(s.moist>65)s.moist-=(s.moist-65)*.75*s.sq;
  s.moist=clamp(s.moist,0,100);
  if(s.moist<15){s.health-=w==='heat'?35:25;add('bad','土がからからに乾き、株がしおれました。','根から水を吸えないと光合成ができず、株が弱ります。暑い日は蒸発が多いので、水を多めにやります。');}
  else if(s.moist<30){s.health-=8;add('warn','土が乾き気味で、葉が少ししおれています。','水を控えると実の糖度は上がりますが、行き過ぎると株を傷めます。');}
  else if(s.moist>88){const dm=Math.round(25*(1.4-s.sq));s.health-=dm;add('bad','土に水がたまり、根が傷んでいます（根腐れ）。','根も呼吸しています。水はけの悪い土で水が多すぎると、根が酸素不足になります。団粒構造の土は水はけがよくなります。');}
  else if(s.moist>75){s.health-=4;add('warn','土がしめりすぎています。','水のやりすぎや長雨は、根の傷みや病気の原因になります。雨の週は水やりを減らします。');}
  // 肥料
  const lr=(w==='longrain'||w==='typhoon')?6:0;
  s.N-=9+lr*(1.2-.4*s.sq);s.PK-=6;
  if(d.fert==='n')s.N+=28;else if(d.fert==='pk')s.PK+=28;else if(d.fert==='bal'){s.N+=16;s.PK+=16;}
  if(d.fert!=='none')s.fertN++;
  if(s.N>70&&lr){s.leach++;add('warn','雨で肥料の一部が流れ出ました。','使われなかった肥料は川や地下水に流れ、水を汚す原因になります。必要な分だけ与えることが大切です。');}
  s.N=clamp(s.N,0,120);s.PK=clamp(s.PK,0,120);
  if(s.N>95){s.health-=15;add('bad','肥料が多すぎて根が傷みました（肥料やけ）。','土の中の肥料が濃すぎると、根が水を吸えなくなります。肥料は多ければよいわけではありません。');}
  else if(s.N>75){ff*=.8;s.dis+=.5;add('warn','葉や茎ばかりがしげり、花や実のつきが悪くなっています（つるぼけ）。','窒素は葉や茎を育てる養分です。多すぎると実がつきにくく、病害虫にも弱くなります。');}
  else if(s.N<20){ff*=.75;s.health-=4;add('warn','下の葉が黄色くなってきました（窒素不足）。','窒素が不足すると葉の色がうすくなり、生育が悪くなります。追肥で補います。');}
  if(t>=4&&s.PK<20){ff*=.8;add('warn','花や実の育ちが悪くなっています（リン酸・カリ不足）。','リン酸は花や実の育ちに、カリは根や茎を丈夫にすることに関わります。');}
  if(c.lime==='no')ff*=.92;
  // 作業
  if(W.includes('wakime'))s.shoots=0;else s.shoots++;
  if(s.shoots>=3){ff*=.85;s.dis+=.5;add('warn','わき芽がのびて、株が混みあっています。','わき芽をかかないと養分が分散し、風通しも悪くなって病気が出やすくなります。');}
  if(W.includes('yuin')){s.staked=true;s.yuinLast=t;}
  if(!s.staked&&t>=3){s.health-=8;add('warn','支柱がなく、株が倒れかけています。','トマトは茎がのびると自分の重さを支えられません。早めに支柱を立てて誘引します。');}
  else if(s.staked&&t-s.yuinLast>=5){ff*=.93;add('warn','誘引が追いつかず、茎が垂れ下がっています。','茎は毎週のびるので、こまめに支柱にしばり直します。');}
  if(W.includes('tekishin')&&s.tekishin<0){s.tekishin=t;if(t<8)add('warn','早い時期に摘心したため、これから咲く花が少なくなりました。','摘心は先端の成長を止める作業です。時期が早すぎると収穫できる実の数が減ります。');else add('good','摘心をして、残りの実に養分を集中させました。','収穫期の後半に摘心すると、すでについている実が大きく、甘く育ちます。');}
  if(s.tekishin>=0&&t>s.tekishin)ff*=s.tekishin<8?.7:1.1;
  if(s.A[t]){if(M(s,'pest')<1)add('good','放したテントウムシが、アブラムシを食べてくれています。','天敵を利用した防除は、農薬を減らせる方法の一つです。');else s.pest++;}
  if(W.includes('mimawari')){if(s.pest>0||s.dis>=1){s.pestN++;add('good','病害虫を見つけて防除しました。','早く見つけるほど、農薬の使用は少なくてすみます。');}s.pest=0;s.dis=Math.max(0,s.dis-2);}
  if(s.pest>=4){s.health-=15;add('bad','アブラムシが大発生し、ウイルス病にかかった株があります。','アブラムシは汁を吸うだけでなく、ウイルス病を広げます。毎日の見回りで早く見つけることが大切です。');}
  else if(s.pest>=2){s.health-=6;add('warn','アブラムシが増えています。','そのままにすると数が急に増えます。');}
  if(w==='longrain'||w==='rain')s.dis+=(w==='longrain'?1.2:.5)*(c.breed==='teikou'?.5:1)*(1.3-.3*s.sq);
  if(s.dis>=5){s.health-=35;add('bad','病気（疫病）が畑全体に広がりました。','湿度が高い時期は病気が広がりやすくなります。病気に強い品種を選ぶ、わき芽をかいて風通しをよくする、見回りで早く対処するなどの方法があります。');}
  else if(s.dis>=3){s.health-=15;add('bad','葉が枯れる病気（疫病）が出始めました。','雨が続いて湿度が高いと、カビの仲間による病気が出やすくなります。');}
  if(w==='heat'){ff*=.8;add('warn','高温のため、花が落ちたり実のつきが悪くなったりしています。','トマトの生育に適した気温は昼20〜25℃くらいです。30℃をこえると花粉の働きが悪くなります。');}

   if(d.molt==='fast'){s.hens=Math.round(s.hens*.97);add('bad','えさを止めて強制換羽を行い、弱った鶏が死にました。','農林水産省の指針では、24時間以上の絶食は行わないことが推奨されています。絶食による強制換羽は、鶏に大きな苦痛を与えます。');}

 const msgs=[{type:'me',msg:'あなたの判断：'+dl},...(lp?[{type:'money',msg:`今回の支出：${yen(lp.y+lp.h*WAGE)}（材料・光熱費など ${yen(lp.y)}／人件費 ${yen(lp.h*WAGE)}・作業 ${r1(lp.h)}時間）`,memo:top?`いちばん大きな支出は「${top[0]}」でした。人が作業する時間にも、人件費というお金がかかります。`:''}]:[]),...(r.L.length?r.L:[{type:'',msg:'大きな変化はありませんでした。'}])];
 if(r.over)msgs.push({type:'bad',msg:r.over.title});
 msgs.forEach(m=>{if(m.memo&&m.type!=='money')collect(S,m.msg,m.memo);});
 const bad=msgs.some(m=>m.type==='bad'),good=!bad&&msgs.some(m=>m.type==='good');
 app.innerHTML=`<div class="hud"><span>${S.icon} ${S.name}</span><span>${S.label(t)}の結果</span><div class="turnbar"><i style="width:${Math.round((t+1)/S.turns*100)}%"></i></div><span>${t+1} / ${S.turns}</span></div>
 <div class="card stage"><div class="stagescene" id="stg"><div class="scene">${S.scene(G.s,t,G.c)}</div><div class="floats" id="fls"></div></div>
 <div class="chips" id="chips"></div><div class="moneybox">💰 所持金 <b id="mny" class="${m0<0?'neg':''}">${yen(m0)}</b><span id="mdiff" class="md"></span></div>
 <div class="rpg" id="rpg" role="button" tabindex="0" aria-label="メッセージを進める"><span class="tagn">${r.over?'⚠ 重大な結果':'結果発表'}</span><span class="pg" id="pg"></span><div class="rpgtxt" id="rt"></div><div class="rpgmemo" id="rm"></div><span class="arrow" id="ar">▼</span></div>
 <div class="row" style="justify-content:center;margin-top:14px"><button class="sub" id="skip">まとめて表示</button><button id="nx" class="big" style="display:none"></button></div></div>`;
 // 数値が飛び出す演出
 setTimeout(()=>{if(bad){$('stg').classList.add('hit');sfx('bad');}else if(good)sfx('good');
  const fl=document.createElement('div');fl.className='flash';fl.style.background=bad?'#e74c3c':good?'#fff6a8':'#ffffff';$('stg').appendChild(fl);
  deltas.forEach((x,i)=>{setTimeout(()=>{const e=document.createElement('div');e.className='fl '+x.c;e.textContent=`${x.lb} ${x.txt}`;e.style.left=(i%2?54:6)+'%';e.style.top=(8+Math.floor(i/2)*22)+'%';$('fls')&&$('fls').appendChild(e);const ch=document.createElement('span');ch.className='chip '+x.c;ch.textContent=`${x.lb} ${x.txt}`;$('chips')&&$('chips').appendChild(ch);},300+i*350);});},250);
 let i=0,timer=null,full=false,readied=false;
 const show=()=>{if(!$('rt'))return;const m=msgs[i];$('pg').textContent=`${i+1} / ${msgs.length}`;const rt=$('rt');rt.className='rpgtxt '+m.type;rt.textContent='';$('rm').textContent='';$('ar').style.visibility='hidden';full=false;let k=0;
  if(i>0&&(m.type==='bad'||m.type==='good'||m.type==='warn')){sfx(m.type);if(m.type==='bad'){$('stg').classList.remove('hit');void $('stg').offsetWidth;$('stg').classList.add('hit');}}
  clearInterval(timer);timer=setInterval(()=>{if(!$('rt')){clearInterval(timer);return;}k+=2;rt.textContent=m.msg.slice(0,k);if(k>=m.msg.length){clearInterval(timer);fin();}},30);};
 const fin=()=>{if(!$('rt'))return;const m=msgs[i];full=true;$('rt').textContent=m.msg;$('rm').textContent=m.memo?'技術メモ：'+m.memo:'';$('ar').style.visibility='visible';if(i===msgs.length-1)ready();};
 const ready=()=>{if(readied)return;readied=true;if($('ar'))$('ar').style.visibility='hidden';$('skip').style.display='none';const nx=$('nx');nx.style.display='';
  if(r.over){nx.textContent='▶ 結果を受け止める';nx.style.background='#444';nx.style.boxShadow='0 5px 0 #222';nx.onclick=()=>{const b=document.createElement('div');b.className='blackout';document.body.appendChild(b);setTimeout(()=>{b.remove();G.over=r.over;bump(S.id,'over');gameOver();},1300);};}
  else{G.last=r.L;G.t++;const end=G.t>=S.turns;nx.textContent=end?'🏆 結果発表へ':'次のターンへ ▶';nx.onclick=()=>end?(sfx('end'),result()):turn();}};
 const adv=()=>{if(!full){clearInterval(timer);fin();return;}if(i<msgs.length-1){i++;show();}};
 $('rpg').onclick=adv;$('rpg').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();adv();}};
 $('skip').onclick=()=>{clearInterval(timer);$('rpg').outerHTML=`<div class="card" style="text-align:left;margin-top:14px">${logHtml(msgs)}</div>`;i=msgs.length-1;ready();};
 const m1=money(S,G.s),dm=m1-m0;setTimeout(()=>{if(!$('mny'))return;$('mdiff').textContent=(dm>=0?'＋':'－')+yen(Math.abs(dm));$('mdiff').className='md '+(dm>=0?'g':'b');sfx(dm>=0?'good':'warn');const st=performance.now();const tk=n=>{if(!$('mny'))return;const k=Math.min(1,(n-st)/1200),v=m0+dm*(1-Math.pow(1-k,3));$('mny').textContent=yen(v);$('mny').className=v<0?'neg':'';if(k<1)requestAnimationFrame(tk);else $('mny').classList.add('bump');};requestAnimationFrame(tk);},500);
 window.scrollTo(0,0);setTimeout(show,700);}

function pickEvent(S,t){const done=G.s.evDone||(G.s.evDone=[]);const sh=(EV[S.id]||[]).find(e=>e.id==='shobu');if(sh&&!done.includes('shobu')&&t===Math.round(S.turns*.6)){done.push('shobu');return sh;}if(t===0||Math.random()>.42)return null;const L=(EV[S.id]||[]).filter(e=>!done.includes(e.id)&&e.when(G.s,t,G.c));if(!L.length)return null;const B=L.filter(e=>e.id==='brand'||e.id==='expand');const e=B.length&&Math.random()<.6?B[Math.floor(Math.random()*B.length)]:L[Math.floor(Math.random()*L.length)];done.push(e.id);return e;}
function modChips(s,t){const L=(s.mods||[]).filter(m=>t>=m.from&&t<=m.until);return L.length?`<div class="mods">${L.map(m=>`<span class="modchip">${m.label}<small>${m.until>=999?'ずっと':'あと'+(m.until-t+1)+'ターン'}</small></span>`).join('')}</div>`:'';}
function eventScreen(S,t,ev){
 app.innerHTML=`<div class="hud"><span>${S.icon} ${S.name}</span><span>${S.label(t)}</span><span class="mchip ${money(S,G.s)<0?'neg':''}">💰 所持金 ${yen(money(S,G.s))}</span></div>
 <div class="card evcard"><div class="evhead">⚡ イベント発生！</div><div class="evicon">${ev.icon}</div><h2>${ev.title}</h2><p>${ev.text}</p>
 <div class="grid" id="chs">${ev.choices.map((c,i)=>`<button class="opt" data-ch="${i}"><b>${c.label}</b>${c.hint?`<span class="small">${c.hint}</span>`:''}</button>`).join('')}</div><div id="evres"></div></div>`;
 banner('⚡ イベント発生！',ev.title,'#e08a1e');sfx('warn');
 app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{const c=ev.choices[+b.dataset.ch],m0=money(S,G.s);const[msg,memo]=c.go(G.s,G.c,t);if(memo)collect(S,ev.title,memo);(G.s.evLog=G.s.evLog||[]).push(`${ev.title}（${c.label}）`);
  app.querySelectorAll('[data-ch]').forEach(x=>{x.disabled=true;x.classList.toggle('sel',x===b);});const m1=money(S,G.s),dm=m1-m0;sfx(dm<0?'warn':'good');
  $('evres').innerHTML=`<div class="rpg" style="cursor:default"><span class="tagn">できごと</span><div class="rpgtxt ${dm<0?'warn':'good'}">${esc(msg)}</div>${memo?`<div class="rpgmemo">技術メモ：${esc(memo)}</div>`:''}</div>
  <div style="text-align:center">${dm?`<div class="moneybox">💰 所持金 <b>${yen(m1)}</b><span class="md ${dm>=0?'g':'b'}">${dm>=0?'＋':'－'}${yen(Math.abs(dm))}</span></div>`:''}${modChips(G.s,t)}<div style="margin-top:14px"><button id="evgo" class="big">管理を決める ▶</button></div></div>`;
  $('evgo').onclick=()=>turn();});
 window.scrollTo(0,0);}

  ${now.length?`<h3>🏅 今回のバッジ</h3><div class="badges">${now.map((b,i)=>`<div class="badge got ${nw.includes(b)?'new':''}" style="animation-delay:${2.4+i*.25}s"><span>${b[1]}</span><b>${b[2]}</b><small>${b[3]}</small>${nw.includes(b)?'<i>NEW!</i>':''}</div>`).join('')}</div>`:''}
  <p class="small">📖 技術メモ図鑑：${S.icon} ${Math.min(zCount(S.id),Math.max(zTotal(S),zCount(S.id)))} / ${Math.max(zTotal(S),zCount(S.id))} 枚</p></div>`};}
function homeExtras(){const W=LS.get('bio_wealth',{sum:0,best:{}}),got=LS.get('bio_badges',{});const bestR=Math.max(1e-9,...Object.values(W.best||{}),0),rk=rankOf(Object.keys(W.best||{}).length?bestR:0);
 return`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="small">これまでに稼いだ利益の合計</div><div class="rank" style="font-size:1.5rem;animation-delay:0s">💰 ${yen(W.sum)}</div><div class="small">最高ランク：${Object.keys(W.best||{}).length?rk[1]+' '+rk[2]:'まだありません'}</div></div><button class="sub" id="zk">📖 技術メモ図鑑（${Object.values(SIMS).map(S=>zCount(S.id)).reduce((a,b)=>a+b,0)}枚）</button></div>
 <h3>🏅 バッジ（${Object.keys(got).length} / ${BADGES.length}）</h3><div class="badges">${BADGES.map(b=>`<div class="badge ${got[b[0]]?'got':''}" title="${b[3]}"><span>${got[b[0]]?b[1]:'🔒'}</span><b>${b[2]}</b><small>${b[3]}</small></div>`).join('')}</div></div>`;}
function zukan(){const Z=Object.values(LS.get('bio_zukan',{}));
 app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>📖 技術メモ図鑑</h2><button class="sub" id="zb">もどる</button></div><p class="small">育成の中で出会った「技術メモ」が集まります。品種や育て方を変えて、いろいろな技術を見つけよう。</p>
 ${Object.values(SIMS).map(S=>{const L=Z.filter(z=>z.sim===S.id),T=Math.max(zTotal(S),L.length);return`<h3>${S.icon} ${S.name}（${L.length} / ${T}）</h3><div class="zgrid">${L.map(z=>`<div class="zcard"><b>${esc(z.title)}</b><p>${esc(z.memo)}</p></div>`).join('')}${Array.from({length:Math.max(0,T-L.length)},()=>`<div class="zcard lock">？</div>`).join('')}</div>`;}).join('')}</div>`;
 $('zb').onclick=home;window.scrollTo(0,0);}

/* トップ */
function home(){G=null;who();const q=LS.get('bio_queue',[]);
 app.innerHTML=`<div class="card hero"><div class="icons"><span>🍅</span><span>🐟</span><span>🐔</span></div><h2>生物育成シミュレーター</h2><p>あなたは<b>道の駅の社長</b>。新しい名物を育てて売り出そう！<br>作物の栽培・水産生物の栽培・動物の飼育から1つ選んで、経営してみよう。<br><b style="color:#c0392b">管理のミスや命を粗末にする選択をすると、育成はそこで終わります。</b></p>${say('わしが社長だ！ 「安く・多く・早く」がモットーだが…生き物の命を預かる以上、もうけだけでは決められん。いっしょに考えて経営するぞ！','happy').replace('class="shacho"','class="shacho big"')}</div>
 ${homeExtras()}
 <div class="card"><h3>題材を選ぶ</h3><div class="grid">${Object.values(SIMS).map(S=>`<button class="opt simcard" data-sim="${S.id}"><span class="band" style="background:${S.color} url(${IP({tomato:'bg_tomato',madai:'bg_madai_sea',hen:'bg_hen_free'}[S.id])}) center/cover;opacity:.75"></span><span class="ico">${S.icon}</span><span class="cnt">挑戦 ${counts(S.id).play}回</span><span class="tag">${S.cat}</span><b>${S.name}</b><span class="small">${S.intro}</span><br><span class="small"><b>💰 元手：${yen(S.capital)}</b></span></button>`).join('')}</div></div>
 <div class="card"><h3>品種改良・遺伝子組換え・ゲノム編集のちがい</h3>${TECH_TABLE}</div>
`;
 app.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>start(b.dataset.sim));if($('zk'))$('zk').onclick=zukan;window.scrollTo(0,0);}

/* 計画 */
function start(id){G={S:SIMS[id],c:{},si:0};setupStep();}
function setupStep(){const S=G.S,st=S.setup[G.si];
 app.innerHTML=`<div class="card"><div class="prog">${S.name} ／ 育成計画 ${G.si+1}/${S.setup.length}</div><h2>${st.title}</h2>${G.si===0?`<p>${S.intro}</p>`:''}
 ${st.tech?`<details open style="margin-bottom:10px"><summary>品種改良・遺伝子組換え・ゲノム編集のちがい</summary>${TECH_TABLE}</details>`:''}
 <div class="grid">${st.options.map(o=>`<button class="opt ${o.disabled?'dis':''} ${G.c[st.key]===o.id?'sel':''}" data-o="${o.id}" ${o.disabled?'aria-disabled="true"':''}>${optImg(G.S,st,o)}${(o.tags||[]).map(tg=>`<span class="tag ${tg==='ゲノム編集'?'ge':tg==='遺伝子組換え'?'gm':''}">${tg}</span>`).join('')}<b>${o.label}</b><span class="small">${o.desc}</span>${tradeHtml(G.S,st.key,o.id)}</button>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="sub" id="back">戻る</button><button id="next" ${G.c[st.key]?'':'disabled'}>次へ</button></div></div>`;
 app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=st.options.find(x=>x.id===b.dataset.o);if(o.disabled){alert(o.desc);return;}G.c[st.key]=o.id;setupStep();});
 $('back').onclick=()=>{if(G.si===0)home();else{G.si--;setupStep();}};
 $('next').onclick=()=>{if(G.si<S.setup.length-1){G.si++;setupStep();}else plan();};window.scrollTo(0,0);}
function choiceText(){return G.S.setup.map(st=>`${st.title}：${st.options.find(o=>o.id===G.c[st.key]).label}`);}
function plan(){const S=G.S;
 app.innerHTML=`<div class="card"><div class="prog">${S.name} ／ 育成計画のまとめ</div><h2>育成計画</h2><div>${choiceText().map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
 ${say('よし、この計画でいこう！ 計画どおりにいくかどうか…ここからが本番だ。','happy')}
 <div class="row" style="margin-top:10px"><button class="sub" id="back">計画を見直す</button><button id="go" class="big">育成スタート！</button></div></div>`;
 $('back').onclick=()=>{G.si=S.setup.length-1;setupStep();};
 $('go').onclick=()=>{G.goal='';G.why='';const seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0;G.rng=rngFrom(seed);G.s=S.init(G.c,G.rng);G.t=0;G.last=null;G.allLogs=[];bump(S.id,'play');turn();};window.scrollTo(0,0);}

/* ターン */
function bars(S){return S.status(G.s,G.c).map(([lb,v,u,rg,txt])=>{if(txt)return`<div class="stat">${lb}<span class="v">${typeof v==='number'?v.toLocaleString():v}${u}</span></div>`;const val=clamp(Math.round(v),0,100);let col='#2f6b4f';if(rg){if(val<rg[0]||val>rg[1])col='#a8601c';}else if(val<40)col='#8f2a2a';else if(val<70)col='#a8601c';return`<div class="stat">${lb}<span class="v">${val}${u}</span><div class="bar"><i style="width:${val}%;background:${col}"></i></div></div>`;}).join('');}
function logHtml(L){return L.map((x,i)=>`<div class="log ${x.type}" style="animation-delay:${i*.12}s">${esc(x.msg)}${x.memo?`<span class="memo">技術メモ：${esc(x.memo)}</span>`:''}</div>`).join('');}
function turn(){const S=G.S,t=G.t;G.s.now=t;if(G.gAt!==t){G.gAt=t;if(gachaTurns(S).includes(t)&&t<S.turns){gachaScreen(S,t);return;}}if(G.evAt!==t){G.evAt=t;const ev=pickEvent(S,t);if(ev){eventScreen(S,t,ev);return;}}const D=S.decisions(G.s,t,G.c);
 app.innerHTML=`<div class="hud"><span>${S.icon} ${S.name}</span><span>${S.label(t)}</span><div class="turnbar"><i style="width:${Math.round(t/S.turns*100)}%"></i></div><span>${t+1} / ${S.turns}</span><span class="mchip ${money(S,G.s)<0?'neg':''}">💰 所持金 ${yen(money(S,G.s))}</span></div>
 ${turnTalk(S,G.s,t)}${modChips(G.s,t)}<div class="layout"><div class="card" style="border-top:6px solid ${S.color}"><div class="scene">${S.scene(G.s,t,G.c)}</div>${bars(S)}<div class="small">${choiceText().map(esc).join('<br>')}</div></div>
 <div>${G.last?`<div class="card"><h3 style="margin-top:0">前のターンの結果</h3>${logHtml(G.last)||'<div class="log">大きな変化はありませんでした。</div>'}</div>`:''}
 <div class="card"><h3 style="margin-top:0">今の状況</h3>${S.info(G.s,t,G.c).map(x=>`<div class="info ${x.type==='n'?'':'w'}">${esc(x.msg)}</div>`).join('')}
 <h3>今回の管理を決める</h3>${D.map(dc=>`<div class="dec"><b>${dc.label}</b>${dc.options.map(([v,l])=>`<label><input type="${dc.type==='radio'?'radio':'checkbox'}" name="${dc.key}" value="${v}" ${dc.type==='radio'&&v===dc.def?'checked':''}>${l.split('｜')[0]}${l.split('｜')[1]?`<small class="hint">${l.split('｜')[1]}</small>`:''}</label>`).join('')}</div>`).join('')}
 <div class="costbox" id="cb"></div><button id="do" class="big">決定して次へ ▶</button></div></div></div>`;
 banner(`${t+1}ターン目`,S.label(t),S.color);
 D.filter(x=>x.type==='check').forEach(dc=>{const bx=[...app.querySelectorAll(`input[name="${dc.key}"]`)];bx.forEach(b=>b.onchange=()=>{if(bx.filter(x=>x.checked).length>dc.max){b.checked=false;alert(`${dc.max}つまで選べます。`);}});});
 const readD=()=>{const d={};D.forEach(dc=>{if(dc.type==='radio')d[dc.key]=(app.querySelector(`input[name="${dc.key}"]:checked`)||{}).value||dc.def;else d[dc.key]=[...app.querySelectorAll(`input[name="${dc.key}"]:checked`)].map(x=>x.value);});return d;};
 const upd=()=>{const C=S.costs(G.s,readD(),t,G.c);let y=0,h=0;C.forEach(x=>{y+=x[1];h+=x[2];});$('cb').innerHTML=`<b>💰 今回の費用（見込み）</b><table>${C.map(x=>`<tr><td>${x[0]}</td><td>${x[2]?'⏱'+r1(x[2])+'時間':''}</td><td class="yen">${x[1]?yen(x[1]):''}</td></tr>`).join('')}<tr><td>人件費（時給${WAGE.toLocaleString()}円 × ${r1(h)}時間）</td><td></td><td class="yen">${yen(h*WAGE)}</td></tr><tr class="sum"><td>合計</td><td></td><td class="yen">${yen(y+h*WAGE)}</td></tr><tr><td>💰 支払い後の所持金（売上が入る前）</td><td></td><td class="yen" style="color:${money(S,G.s)-y-h*WAGE<0?'#c0392b':'inherit'}">${yen(money(S,G.s)-y-h*WAGE)}</td></tr></table>${money(S,G.s)-y-h*WAGE<0?'<div class="small" style="color:#c0392b">所持金が足りなくなると、お金を借りることになり、利息がかかります。</div>':''}`;};
 app.querySelectorAll('.dec input').forEach(x=>x.addEventListener('change',upd));upd();
 $('do').onclick=()=>{const d={};D.forEach(dc=>{if(dc.type==='radio')d[dc.key]=(app.querySelector(`input[name="${dc.key}"]:checked`)||{}).value||dc.def;else d[dc.key]=[...app.querySelectorAll(`input[name="${dc.key}"]:checked`)].map(x=>x.value);});
  const before=S.status(G.s,G.c),m0=money(S,G.s);const r=S.step(G.s,d,t,G.rng,G.c);
  if(!r.over){const m=money(S,G.s);if(m<0){const it=Math.round(-m*.01);payCosts(G.s,[['借入金の利息',it,0]],true);G.s.debt=true;r.L.push({type:'warn',msg:`所持金が足りず、お金を借りています。利息 ${yen(it)} を払いました。`,memo:'お金が足りないと借入金に利息がかかります。費用をかけすぎないことも経営の技術です。'});}}
  G.allLogs.push({t,L:r.L});
  const lab=(dc,v)=>(dc.options.find(o=>o[0]===v)||[0,''])[1].split('｜')[0];
  const dl=D.map(dc=>{const v=d[dc.key];return dc.label.replace(/（.*?）/g,'')+'：'+(dc.type==='radio'?lab(dc,v):(v.length?v.map(x=>lab(dc,x)).join('・'):'なし'));}).join('／');
  outcome(S,t,dl,r,deltaItems(before,S.status(G.s,G.c)),m0);};window.scrollTo(0,0);}

/* ゲームオーバー */
function gameOver(){const S=G.S,o=G.over,last=G.allLogs[G.allLogs.length-1];collect(S,o.title,o.explain);
 app.innerHTML=`<div class="go"><div class="prog" style="color:#bbb">${S.name} ／ ${S.label(G.t)}</div><h2>育成はここで終わりです</h2><div class="cause">${esc(o.title)}</div>${o.explain?`<p class="memo">技術メモ：${esc(o.explain)}</p>`:''}<p class="memo" style="text-align:center">失われた命を無駄にしないために、何が原因だったのかを考えよう。</p></div>
 ${last&&last.L.length?`<div class="card"><h3 style="margin-top:0">このターンに起きたこと</h3>${logHtml(last.L)}</div>`:''}
 <div class="card">${say('わしの判断のどこがまずかったのか…。原因を考えて、もう一度挑戦だ！','worried')}<div class="row" style="justify-content:center;margin-top:10px"><button id="again" class="big">もう一度挑戦する</button><button class="sub" id="top">題材選択へ</button></div></div>`;
 bump(S.id,'over');
 $('again').onclick=()=>start(S.id);$('top').onclick=home;window.scrollTo(0,0);}

/* 結果 */
function chartSvg(vals,label,color){if(!vals.length)return'';const w=560,h=170,p=34,mx=Math.max(...vals,1);const pts=vals.map((v,i)=>[p+i*(w-2*p)/Math.max(1,vals.length-1),h-p-(v/mx)*(h-2*p)]);
 return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px" role="img" aria-label="${label}"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#bbb"/><line x1="${p}" y1="${p-10}" x2="${p}" y2="${h-p}" stroke="#bbb"/><text x="${p}" y="16" font-size="12" fill="#555">${label}（最大 ${mx.toLocaleString()}）</text><polyline fill="none" stroke="${color}" stroke-width="2.5" points="${pts.map(x=>x.join(',')).join(' ')}"/>${pts.map(x=>`<circle cx="${x[0]}" cy="${x[1]}" r="3" fill="${color}"/>`).join('')}<text x="${w-p}" y="${h-10}" font-size="11" fill="#777" text-anchor="end">ターン →</text></svg>`;}
function result(){const S=G.S,R=S.result(G.s,G.c),total=R.axes.reduce((a,x)=>a+x[1],0);
 const H=LS.get('bio_hist',{});const prev=(H[S.id]||[]).slice(-5);
 H[S.id]=[...(H[S.id]||[]),{date:new Date().toLocaleString('ja-JP'),setting:choiceText().join(' ／ '),axes:R.axes.map(x=>x[1]),total}].slice(-10);LS.set('bio_hist',H);const EX=rewards(S,R,total);
 const best=prev.length?Math.max(...prev.map(x=>x.total)):null;const low=R.axes.filter(x=>x[1]<=2).map(x=>x[0]);
 app.innerHTML=`<div class="card" style="border-top:5px solid ${S.color}"><div class="prog">${S.name} ／ 育成完了</div><div class="scene" style="max-width:420px;margin:0 auto 12px">${S.scene(G.s,S.turns-1,G.c)}</div><h2 style="text-align:center">🎉 育成を最後までやりとげました！</h2><div style="text-align:center;margin-bottom:10px"><div class="moneybox">💰 元手 ${yen(S.capital)} → 最終の所持金 <b class="${money(S,G.s)<S.capital?'neg':'pos'}">${yen(money(S,G.s))}</b></div></div><p>${esc(R.summary)}</p>
 <table><tr><th>評価の観点</th><th>評価</th><th>内容</th></tr>${R.axes.map((x,i)=>`<tr><td>${x[0]}</td><td class="stars">${starsAnim(x[1],i)}</td><td>${esc(x[2])}</td></tr>`).join('')}<tr><th>合計</th><th><span class="total">${total}</span> / 20</th><th>${best!==null?(total>best?`これまでの最高（${best}）を更新しました。`:`これまでの最高は${best}です。`):'初めての記録です。'}</th></tr></table>
 <h3>💰 費用の内訳</h3><table>${Object.entries(G.s.book||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="yen">${yen(v)}</td><td style="width:40%"><div class="bar"><i style="width:${Math.round(v/G.s.cost*100)}%;background:#e0a92e"></i></div></td></tr>`).join('')}<tr class="sum"><td>合計（作業時間 ${Math.round(G.s.hours||0).toLocaleString()}時間）</td><td class="yen">${yen(G.s.cost)}</td><td></td></tr></table>
 <div style="margin-top:10px">${chartSvg(R.chart.vals,R.chart.label,S.color)}</div></div>
 ${balanceHtml(S)}${EX.html}<div class="card"><h3 style="margin-top:0">この題材で学べる技術</h3><ul>${R.points.map(p=>`<li>${p}</li>`).join('')}<li>よい管理には、資材や光熱費だけでなく人の作業時間（人件費）もかかります。効果と費用のバランス（トレードオフ）を考えて技術を選ぶことが大切です。</li></ul>
 <p class="small">すべての観点で★5を取るのは難しく、どれかを高めると別のどれかが下がることがあります。${low.length?`今回は「${low.join('」「')}」が低めでした。`:''}品種や方法を変えて、もう一度挑戦して比べてみましょう。</p>
 ${prev.length?`<h3>これまでの記録</h3><table><tr><th>日時</th><th>設定</th><th>合計</th></tr>${prev.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.setting)}</td><td>${x.total}</td></tr>`).join('')}</table>`:''}</div>
 <div class="card">${total>=15?say('大成功だ！ 道の駅の名物として胸を張れるぞ。次は別の育て方でも試してみるか！','happy'):total>=10?say('まずまずだな。だが、まだ伸ばせるところがある。次はどこを変えてみようか。'):say('うーむ…思ったようにはいかなかった。品種や方法を変えて、もう一度やり直そう！','worried')}<div class="row" style="justify-content:center;margin-top:10px"><button id="again" class="big">もう一度挑戦する</button><button class="sub" id="top">題材選択へ</button></div></div>`;
 confetti();banner('育成完了！',`${S.name}`,S.color);
 $('again').onclick=()=>start(S.id);$('top').onclick=home;window.scrollTo(0,0);}

home();
}
</script>
