<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いのちの産地めぐり すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22313a;--sub:#5a6b74;--line:#e2e8ee;--accent:#23905c;--accent2:#176b43;--bad:#c0392b;--rx:42deg}
*{box-sizing:border-box}
body{margin:0;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);line-height:1.6;background:radial-gradient(ellipse at 50% 30%,#bfe6ff 0%,#8fc9f0 55%,#5e9fd0 100%) fixed;min-height:100vh;overflow-x:hidden}
header{background:linear-gradient(90deg,#1f8a57,#2a9fc9);color:#fff;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15);position:relative;z-index:5}
header h1{font-size:1.08rem;margin:0;letter-spacing:.05em}
.hbtn{background:rgba(255,255,255,.22);box-shadow:none;padding:3px 12px;font-size:.85rem;border-radius:999px}
.hbtn:active{transform:none;box-shadow:none}
main{max-width:1440px;margin:0 auto;padding:8px}
.card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 0 rgba(30,60,80,.12),0 10px 24px rgba(30,60,80,.1);animation:pop .35s both}
.hero{text-align:center}.hero h2{font-size:1.8rem;color:#1f7a4d;margin:4px 0}
.hero .icons{font-size:46px;display:flex;justify-content:center;gap:18px}.hero .icons span{animation:float 3s ease-in-out infinite;display:inline-block}
.hero .icons span:nth-child(2n){animation-delay:.6s}.hero .icons span:nth-child(3n){animation-delay:1.2s}
h2{font-size:1.15rem;margin:4px 0 10px}
button{font:inherit;border:none;border-radius:14px;padding:10px 20px;background:var(--accent);color:#fff;cursor:pointer;font-weight:800;box-shadow:0 5px 0 var(--accent2);transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
button.sub{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:0 5px 0 #bfe3cf}
button:disabled{background:#b7c2bc;box-shadow:0 5px 0 #98a49d;cursor:not-allowed;color:#eef}
button.big{font-size:1.15rem;padding:13px 30px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nbtn{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);min-width:60px;font-size:1.1rem}
.nbtn.sel{border-color:var(--accent);background:#e7f7ee;box-shadow:0 4px 0 var(--accent)}
select,.prow input{font:inherit;padding:7px;border:2px solid #cbd6dc;border-radius:10px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--line)}
.prow input{width:210px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:800;flex:none;font-size:.85rem}
ul.rules li{margin-bottom:3px}
.small{font-size:.85rem;color:var(--sub)}
/* ===== マップ ===== */
.game{display:grid;grid-template-columns:1fr 330px;gap:8px;align-items:start}
@media(max-width:960px){.game{grid-template-columns:1fr}}
.stage{position:relative;height:calc(100vh - 62px);min-height:470px;overflow:hidden;border-radius:20px;background:linear-gradient(#9fd7f7,#b8e2a0 60%)}
.cam{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 18%}
.tilt{position:absolute;left:50%;top:60%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(var(--rx)) scale(var(--z,1))}
.map{position:absolute;left:0;top:0;width:2250px;height:1750px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.map>svg{position:absolute;left:0;top:0}
.nd{position:absolute;transform:translate(-50%,-50%);transform-style:preserve-3d}
.sq{width:34px;height:34px;border-radius:9px;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.3),inset 0 0 0 2px rgba(255,255,255,.45)}
.sq.B{background:#2f7fe0}.sq.R{background:#e2483a}.sq.Y{background:#f2c230;color:#7a5500}.sq.Q{background:#9b5fd6}
.stn{width:62px;height:62px;border-radius:50%;background:#fff;border:6px solid var(--ac);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 7px 0 rgba(0,0,0,.3)}
.stn.lab{border-radius:14px}
.stn.own{box-shadow:0 7px 0 rgba(0,0,0,.3),0 0 0 6px var(--oc)}
.nd.cand .sq,.nd.cand .stn{animation:candp .7s infinite alternate}
.nd.lit .sq,.nd.lit .stn{box-shadow:0 0 0 5px #ffd34d,0 0 26px 8px #fff3a8}
.bb{position:absolute;transform-style:preserve-3d}
.bb>.up{position:absolute;left:0;bottom:0;transform:translateX(-50%) rotateX(calc(-1 * var(--rx)));transform-origin:50% 100%;white-space:nowrap}
.deco>.up{font-size:var(--fs,36px);line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.deco.sway>.up{animation:sway 3s ease-in-out infinite alternate}
.deco.hide{display:none}.deco.appear>.up{animation:popup .8s both}
.lbl>.up{background:rgba(255,255,255,.95);border-radius:10px;padding:1px 9px;font-weight:800;font-size:14px;text-align:center;line-height:1.25;box-shadow:0 3px 0 rgba(0,0,0,.18);border:2px solid var(--ac)}
.lbl>.up small{display:block;font-size:10px;color:var(--sub)}
.lbl .ownf{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:4px;vertical-align:middle;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.sign>.up{background:var(--ac);color:#fff;font-weight:800;font-size:20px;padding:3px 16px;border-radius:12px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.flag>.up{font-size:54px;animation:flagb 1s ease-in-out infinite alternate;filter:drop-shadow(0 6px 3px rgba(0,0,0,.3))}
.flag>.up b{display:block;font-size:13px;background:#e2483a;color:#fff;border-radius:999px;padding:0 8px;margin-top:-6px;text-align:center}
.pawn{position:absolute;width:0;height:0;transform-style:preserve-3d;transition:left .26s ease,top .26s ease}
.pawn .psh{position:absolute;width:30px;height:14px;left:-15px;top:-7px;border-radius:50%;background:rgba(0,0,0,.3)}
.pawn .pst{position:absolute;left:-20px;bottom:0;width:40px;transform-origin:50% 100%;transform:rotateX(calc(-1 * var(--rx)));display:flex;flex-direction:column;align-items:center}
.pawn .phop{display:flex;flex-direction:column;align-items:center;position:relative}
.pawn .pbody{width:38px;height:38px;border-radius:50%;background:#fff;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.25);position:relative}
.pawn .pbody b{position:absolute;right:-8px;top:-8px;background:var(--c);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pawn .pbase{width:28px;height:13px;margin-top:-3px;background:var(--c);clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);border-radius:0 0 6px 6px;filter:brightness(.8)}
.pawn .pchar{position:absolute;top:-34px;left:24px;font-size:30px;animation:bob .6s ease-in-out infinite alternate;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.pawn.cur .pbody{box-shadow:0 0 0 4px #fff,0 0 18px 7px var(--c)}
.pawn.cur .phop{animation:bob .8s ease-in-out infinite alternate}
.pawn.hop .phop{animation:hop .26s ease-out}
/* HUD */
.hud{position:absolute;left:10px;right:10px;top:8px;display:flex;gap:8px;flex-wrap:wrap;z-index:4;pointer-events:none}
.hud>div{background:rgba(255,255,255,.94);border-radius:14px;padding:5px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15);font-weight:800;font-size:.9rem}
.meter{min-width:300px}
.mbar{height:14px;background:#e3e9ec;border-radius:999px;overflow:hidden;position:relative;margin-top:2px}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#8bd36a,#ffd34d,#ff8a3d);transition:width .9s}
.mbar span{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.9)}
.lvs{font-size:.75rem;color:var(--sub);display:flex;justify-content:space-between}
.chips span{display:inline-block;background:#fdeeee;border:2px solid #f2a39b;border-radius:999px;padding:0 8px;margin-left:4px;font-size:.8rem}
/* サイド */
.side .turn{background:#fff;border-radius:18px;padding:10px 12px;border:5px solid;box-shadow:0 6px 0 rgba(30,60,80,.12);margin-bottom:8px;text-align:center}
.tname{font-size:1.2rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.money{font-size:1.35rem;font-weight:800;color:#8a5a00}
.money.neg{color:var(--bad)}
.tsub{color:var(--sub);font-size:.85rem;margin-bottom:6px}
#roll{width:100%;font-size:1.2rem;padding:12px;background:linear-gradient(#ff9f2e,#ff7a1a);box-shadow:0 6px 0 #c4520a}
#roll:not(:disabled){animation:pulse 1.4s infinite}
.hand{margin-top:8px;text-align:left}
.cardc{display:flex;gap:6px;align-items:center;background:#eef6fd;border:2px solid #9cc8ef;border-radius:10px;padding:4px 9px;margin-top:5px;font-weight:700;font-size:.86rem;cursor:pointer;width:100%;color:var(--ink);box-shadow:none}
.cardc:active{transform:none;box-shadow:none}.cardc span{font-size:1.2rem}.cardc.new{animation:glow 1.2s 2}
.branch{margin-top:8px}.branch button{width:100%;margin-top:6px;text-align:left;background:#fff;color:var(--ink);border:3px solid #2a9fc9;box-shadow:0 4px 0 #9cc8ef;font-size:.92rem}
.branch button.auto{background:#2a9fc9;color:#fff;text-align:center}
.plist{background:#fff;border-radius:18px;padding:6px 10px;box-shadow:0 6px 0 rgba(30,60,80,.12);margin-bottom:8px}
.pr{display:grid;grid-template-columns:24px 1fr 92px 34px 28px;gap:4px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line);font-size:.84rem}
.pr:last-child{border-bottom:none}.pr.now{background:#fffbea;border-radius:8px}
.pr .pn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.pr .pm{text-align:right;font-weight:800;color:#8a5a00}.pr .pm.neg{color:var(--bad)}
.mini{background:#fff;border-radius:18px;padding:6px;box-shadow:0 6px 0 rgba(30,60,80,.12)}
.mini svg{width:100%;height:auto;display:block}
.dest{font-weight:800;font-size:.9rem;margin-bottom:4px}
/* サイコロ */
.diceov{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;gap:24px;pointer-events:none;background:rgba(10,20,40,.25)}
.diceov.hidden{display:none}
.dscene{width:110px;height:110px;perspective:600px;animation:throw .9s cubic-bezier(.3,.7,.4,1) both}
.cube{position:relative;width:110px;height:110px;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#e9edf1);border-radius:18px;border:3px solid #cfd8de;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px}
.face i{width:20px;height:20px;border-radius:50%;background:#22313a;margin:auto}
.face.f1 i{background:#e0362c}
.f1{transform:translateZ(55px)}.f6{transform:rotateY(180deg) translateZ(55px)}.f3{transform:rotateY(90deg) translateZ(55px)}
.f4{transform:rotateY(-90deg) translateZ(55px)}.f2{transform:rotateX(90deg) translateZ(55px)}.f5{transform:rotateX(-90deg) translateZ(55px)}
.dres{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:110px;font-weight:800;color:#fff;text-shadow:0 6px 0 #ff7a1a,0 0 30px rgba(0,0,0,.4);z-index:46}
.dres span{display:block;animation:starpop .5s both}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(20,30,40,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.hidden{display:none}
.mbox{background:#fff;border-radius:22px;padding:18px 22px;max-width:640px;width:100%;max-height:94vh;overflow:auto;text-align:center;border:5px solid #9cc8ef;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:zoomin .35s cubic-bezier(.2,.9,.3,1.3) both}
.mbox.warn{border-color:#f08a3a}.mbox.good{border-color:#4cc38a}.mbox.quiz{border-color:#9b78d6}.mbox.gold{border-color:#f0c64a;background:linear-gradient(180deg,#fffbea,#fff)}
.mbox.dark{background:radial-gradient(circle at 50% 0,#3b2c4a,#140f1c);color:#eee;border-color:#6a4a8a}
.micon{font-size:60px;line-height:1.2;animation:starpop .5s both}
.mbox h2{font-size:1.35rem;margin:4px 0 8px}
.mbody{font-size:1.02rem}
.memo{font-size:.9rem;color:var(--sub);background:#f4f7f9;border-radius:10px;padding:8px 12px;text-align:left;margin:10px 0 0}
.mbox.dark .memo{background:rgba(255,255,255,.08);color:#ddd}
.mbtns{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.mbtns button{width:100%}
.mbtns.choices button{background:#fff;color:var(--ink);border:3px solid #b79ee0;box-shadow:0 4px 0 #d9ccf0;text-align:left}
.ng{color:var(--bad);font-weight:800}.okc{color:#1a8a4d;font-weight:800}
.qprog{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.qprog span{width:30px;height:30px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:800}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;background:#f6fbf8;border:3px solid var(--ac,#8bc34a);border-radius:14px;padding:10px 14px;margin:8px 0}
.pcard .pi{font-size:46px}.pcard b{font-size:1.1rem}
.bigcard{width:200px;height:270px;margin:6px auto 4px;perspective:900px}
.bigcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip 1s .15s cubic-bezier(.3,.8,.3,1.1) both}
.bigcard .bk,.bigcard .fr{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bigcard .bk{background:repeating-linear-gradient(45deg,#2a9fc9 0 12px,#1f8a57 12px 24px);color:#fff;font-size:64px;border:6px solid #fff}
.bigcard .fr{background:linear-gradient(160deg,#fff,#e8f4ff);border:6px solid #4a9be0;transform:rotateY(180deg);padding:12px}
.bigcard .fr .ci{font-size:74px;line-height:1.1}.bigcard .fr .cn{font-weight:800;font-size:1.1rem;margin-top:8px}
.bigcard .fr .ct{font-size:.72rem;color:#4a9be0;font-weight:800;letter-spacing:.1em}
.charbig{font-size:110px;line-height:1;display:inline-block;animation:charin 1s cubic-bezier(.2,.9,.3,1.3) both}
.charfly{font-size:110px;display:inline-block;animation:charout 1.1s ease-in both}
.say{display:inline-block;background:#fff;color:#22313a;border-radius:16px;padding:6px 16px;font-weight:800;margin:6px 0;position:relative}
.ktab td,.ktab th{font-size:.92rem}
/* 演出 */
.fxl{position:fixed;inset:0;pointer-events:none;z-index:44;overflow:hidden}
.tint{position:fixed;inset:0;pointer-events:none;z-index:43;opacity:0}
.tint.on{animation:tint var(--d,1.6s) ease both}
.pt{position:absolute;line-height:1}
.pt.fall{animation:fallp var(--d) linear var(--dl) both}
.pt.rain{width:2px;height:22px;background:linear-gradient(transparent,rgba(220,235,255,.95));animation:rainf var(--d) linear var(--dl) both}
.pt.rise{animation:risep var(--d) ease-out var(--dl) both}
.pt.crawl{animation:crawl var(--d) linear var(--dl) both}
.pt.burst{left:50%;top:50%;animation:burst var(--d) cubic-bezier(.2,.8,.3,1) var(--dl) both}
.pt.drift{animation:drift var(--d) ease-in-out var(--dl) both}
.pt.fw{animation:burst var(--d) cubic-bezier(.2,.8,.3,1) var(--dl) both}
.amb{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.amb .pt{animation-iteration-count:infinite!important;opacity:.8}.amb .pt.rain{opacity:.5}
.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:47}
.banner div{background:#fff;padding:12px 44px;border-radius:22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.2);animation:banner var(--bd,1.5s) cubic-bezier(.2,.8,.3,1) both;border:5px solid var(--c,#23905c)}
.banner b{display:block;font-size:1.9rem;color:var(--c,#23905c);line-height:1.3}
.banner small{font-size:1rem;color:var(--sub)}
.floatm{position:fixed;z-index:48;font-weight:800;font-size:1.6rem;pointer-events:none;animation:floatm 1.6s ease-out both;text-shadow:0 2px 0 #fff,0 0 8px #fff}
.shake{animation:hit .55s}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fallc linear forwards;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:#eef5f1}
.qcard{border:4px solid #f0c64a;background:linear-gradient(180deg,#fffbea,#fff)}
.qcard li{margin-bottom:6px;font-size:1.03rem}
.score{font-size:2.2rem;font-weight:800;color:#1f7a4d}
.trophy{font-size:80px;display:inline-block;animation:spinY 2.4s ease-in-out infinite}
footer{text-align:center;color:#eaf6ff;font-size:.78rem;padding:6px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-28px) scale(1.05)}100%{transform:translateY(0)}}
@keyframes sway{from{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) rotate(-4deg)}to{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) rotate(4deg)}}
@keyframes popup{0%{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) scale(0)}70%{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) scale(1.4)}100%{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) scale(1)}}
@keyframes flagb{from{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) translateY(0)}to{transform:translateX(-50%) rotateX(calc(-1 * var(--rx))) translateY(-10px)}}
@keyframes candp{from{box-shadow:0 0 0 3px #fff}to{box-shadow:0 0 0 8px #2a9fc9,0 0 22px 6px #9cd8f5}}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.04)}}
@keyframes glow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px #ffd34d,0 0 14px #ffd34d}}
@keyframes throw{0%{transform:translate(-55vw,40vh) scale(.5) rotate(-90deg)}70%{transform:translate(0,-30px) scale(1.15)}85%{transform:translate(0,8px) scale(.95)}100%{transform:none}}
@keyframes starpop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes flip{from{transform:rotateY(0) scale(.6)}to{transform:rotateY(180deg) scale(1)}}
@keyframes tint{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes fallp{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(var(--r,360deg))}}
@keyframes rainf{from{transform:translate(0,-12vh) rotate(12deg)}to{transform:translate(-18vw,112vh) rotate(12deg)}}
@keyframes risep{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-70vh) scale(1.2);opacity:0}}
@keyframes crawl{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
@keyframes drift{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
@keyframes banner{0%{transform:translateX(-110vw) skewX(-12deg)}22%{transform:translateX(0) skewX(0)}75%{transform:translateX(0);opacity:1}100%{transform:translateX(110vw) skewX(12deg);opacity:0}}
@keyframes hit{0%,100%{transform:none}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,0)}}
@keyframes fallc{to{transform:translateY(112vh) rotate(760deg)}}
@keyframes spinY{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.1)}}
@keyframes floatm{0%{transform:translateY(10px);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}

 for(let j=1;j<=k;j++){const t=j/(k+1),w=Math.sin(t*Math.PI)*18*(ei%2?1:-1),x=A.x+dx*t-dy/d*w,y=A.y+dy*t+dx/d*w;const n=addN({t:TPAT[tc++%TPAT.length],x,y});ADJ[prev].push(n);ADJ[n].push(prev);prev=n;pts.push([x,y]);}

async function turnStart(){const p=CP();G.busy=false;G.nextDice=1;focus(p.node);renderPawns();renderSide();renderHud();

async function roll(){if(G.busy)return;G.busy=true;renderSide();const p=CP();
 const vals=Array.from({length:G.nextDice},()=>1+rand(6));const n=await rollDice(vals);G.nextDice=1;
 const r=await move(p,n);const nd=NODES[p.node];$('nd'+p.node).classList.add('lit');await sleep(250);
 if(r!=='dest')await land(p,nd);
 $('nd'+p.node)&&$('nd'+p.node).classList.remove('lit');

async function move(p,steps){let prev=null;G.auto=false;let moved=false;
 for(let s=steps;s>0;s--){let opts=ADJ[p.node].filter(n=>n!==prev);if(!opts.length)opts=ADJ[p.node];
  let nx;if(opts.length===1)nx=opts[0];else if(G.auto)nx=best(opts);else nx=await chooseBranch(p,opts,s);
  prev=p.node;p.node=nx;focus(nx);renderPawns(G.cur);sfx('hop');await sleep(RM?60:290);
  if(nx===G.dest){await arriveDest(p);return'dest';}
  const ch=G.chars.find(c=>c.h===G.cur);const other=G.P.findIndex((q,i)=>i!==G.cur&&q.node===nx);
  if(ch&&other>=0&&!moved){moved=true;ch.h=other;renderPawns();renderHud();sfx('boss');await banner(`${CHARS[ch.k].i} ${CHARS[ch.k].n}が ${esc(G.P[other].name)}社長に うつった！`,'すれちがうと、キャラクターがうつります',G.P[other].color,1400);renderSide();}}
 $('branch').innerHTML='';return'';}
const best=opts=>{const m=Math.min(...opts.map(o=>G.D[o]));return pick(opts.filter(o=>G.D[o]===m));};
function headTo(from,nx){let a=from,b=nx,k=0;while(NODES[b].t!=='S'&&k<20){const c=ADJ[b].find(v=>v!==a);a=b;b=c;k++;}return NODES[b].s;}
function chooseBranch(p,opts,left){return new Promise(res=>{const br=$('branch');
 opts.forEach(o=>$('nd'+o).classList.add('cand'));
 const done=v=>{opts.forEach(o=>$('nd'+o).classList.remove('cand'));br.innerHTML='';res(v);};
 br.innerHTML=`<b>🔀 のこり${left}マス。どっちに進む？</b>`+opts.map(o=>{const s=headTo(p.node,o);return`<button data-o="${o}">${AREA[s.a].i} ${s.pref}の${s.name} 方面<br><span class="small">🚩目的地まで ${G.D[o]}マス</span></button>`;}).join('')+`<button class="auto" id="autob">🤖 おまかせ（目的地に近い道）</button>`;
 br.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>done(+b.dataset.o));
 $('autob').onclick=()=>{G.auto=true;done(best(opts));};});}

 await banner('🚩 目的地 到着！',`${esc(p.name)}社長が ${s.pref}の${s.name}に一番乗り！`,p.color,1800);
 await modal({icon:'🚩',cls:'gold',title:`${esc(p.name)}社長、目的地に到着！`,body:`援助金 <b>1000万円</b> をもらいました！<p class="memo">${s.lab||s.p.m}</p>`,buttons:[{label:'受け取る ▶',v:1}]});

 p.money-=d;renderSide();if(d)floatMoney(-d);
 await modal({icon:e.i,cls:'warn',title:`${e.n}`,body:`${note?`<b class="okc">${note}</b><br>`:''}${d?`<b class="ng" style="font-size:1.3rem">−${fmt(d)}</b>`:'<b class="okc">損害なし！</b>'}${lv()>=3&&d?'<br><span class="small">活気Lv3以上の助け合いで損害が軽くなった</span>':''}<p class="memo">技術メモ：${e.m}</p>`,buttons:[OK]});

 const go=await modal({icon:s.i,cls:'gold',title:`${s.pref}の${s.p.n}`,body:`${card}<b>産地テスト（3問中2問正解）に合格すると買えます！</b><br><span class="small">全問正解なら1割引。班のみんなで相談しよう！</span>`,buttons:[{label:'📝 産地テストに挑戦！',v:1},{label:'今回は見送る',v:0,cls:'sub'}]});

  await addMeter(perfect?22:15,`${esc(p.name)}社長が${s.pref}の${s.p.n}を購入！`);}
 else{p.tf++;sfx('bad');await modal({icon:'📚',title:`不合格…（${n}問正解）`,body:'今回は買えませんでした。解説を思い出して、次に止まったときに再挑戦しよう！',buttons:[OK]});}}

async function endTurn(){G.turns++;G.busy=false;
 if(G.turns%G.P.length===0){G.played++;
  for(const c of [...G.chars]){c.left--;if(c.left<=0){G.chars=G.chars.filter(x=>x!==c);await banner(`${CHARS[c.k].i} ${CHARS[c.k].n}は去っていった`,'',' #6a4a8a',1200);}}
  if(G.played%6===0||G.played===G.len)await kessan();
  if(G.played>=G.len)return finish();
  G.month=G.month%12+1;await monthStart();}

  await modal({cls:'dark',title:'オンダンカ神様 が あらわれた！',body:`<div class="charbig">${C.i}</div><br><span class="say">「${C.say}」</span><br>いる間は、毎月<b>班全体の活気</b>が下がってしまう！<p class="memo">${C.m}</p>`,buttons:[{label:'みんなで立ち向かおう！ ▶',v:1}]});
