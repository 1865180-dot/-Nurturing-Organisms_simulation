<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>いのちを育てる1年すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#22313a;--sub:#5a6b74;--line:#e2e8ee;--accent:#23905c;--accent2:#176b43;--bad:#c0392b;--rx:54deg;--rz:-8deg}
*{box-sizing:border-box}
body{margin:0;font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);line-height:1.6;background:radial-gradient(ellipse at 50% 30%,#bfe6ff 0%,#8fc9f0 55%,#5e9fd0 100%) fixed;min-height:100vh;overflow-x:hidden}
header{background:linear-gradient(90deg,#1f8a57,#2a9fc9);color:#fff;padding:7px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.15);position:relative;z-index:5}
header h1{font-size:1.1rem;margin:0;letter-spacing:.05em}
.hbtn{background:rgba(255,255,255,.22);box-shadow:none;padding:3px 12px;font-size:.85rem;border-radius:999px}
.hbtn:active{transform:none;box-shadow:none}
main{max-width:1400px;margin:0 auto;padding:10px}
.card{background:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:0 6px 0 rgba(30,60,80,.12),0 10px 24px rgba(30,60,80,.1);animation:pop .35s both}
.hero{text-align:center}.hero h2{font-size:1.8rem;color:#1f7a4d;margin:4px 0}
.hero .icons{font-size:50px;display:flex;justify-content:center;gap:22px}.hero .icons span{animation:float 3s ease-in-out infinite;display:inline-block}
.hero .icons span:nth-child(2){animation-delay:.5s}.hero .icons span:nth-child(3){animation-delay:1s}.hero .icons span:nth-child(4){animation-delay:1.5s}
h2{font-size:1.15rem;margin:4px 0 10px}
button{font:inherit;border:none;border-radius:14px;padding:10px 20px;background:var(--accent);color:#fff;cursor:pointer;font-weight:800;box-shadow:0 5px 0 var(--accent2);transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent2)}
button.sub{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:0 5px 0 #bfe3cf}
button:disabled{background:#b7c2bc;box-shadow:0 5px 0 #98a49d;cursor:not-allowed}
button.big{font-size:1.15rem;padding:13px 30px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nbtn{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);min-width:64px;font-size:1.2rem}
.nbtn.sel{border-color:var(--accent);background:#e7f7ee;box-shadow:0 4px 0 var(--accent)}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}
.prow input{font:inherit;padding:8px;border:2px solid #cbd6dc;border-radius:10px;width:200px}
.sb{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);padding:6px 12px;font-weight:700}
.sb.sel{border-color:var(--accent);background:#e7f7ee;box-shadow:0 3px 0 var(--accent)}
.dot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;flex:none}
ul.rules li{margin-bottom:4px}
.small{font-size:.85rem;color:var(--sub)}

/* ===== 3D盤面 ===== */
.game{display:grid;grid-template-columns:1fr 330px;gap:10px;align-items:start}
@media(max-width:960px){.game{grid-template-columns:1fr}}
.stage{position:relative;height:calc(100vh - 80px);min-height:470px;overflow:hidden;border-radius:22px}
.bscale{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-345px 0 0 -320px;perspective:1300px;perspective-origin:50% 20%}
.board{position:relative;width:640px;height:640px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateZ(var(--rz));transition:transform 1s ease;
 display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:4px;padding:14px;border-radius:26px;
 background:linear-gradient(135deg,#8a5a34,#6b4226);box-shadow:0 18px 0 #4a2d18,0 34px 40px rgba(0,0,0,.35)}
.tile{position:relative;transform-style:preserve-3d;border-radius:9px;background:var(--sc);box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.55);text-align:center;transition:transform .35s,box-shadow .35s}
.tile .ic{font-size:22px;line-height:1;margin-top:9px;display:block}
.tile .lb{font-size:10px;font-weight:800;color:#33444d;display:block;margin-top:2px;white-space:nowrap}
.tile .no{position:absolute;top:1px;left:4px;font-size:9px;color:rgba(0,0,0,.4);font-weight:800}
.tile.t-T{background:linear-gradient(var(--sc),var(--sc)) padding-box,#f08a3a;border-top:6px solid #f08a3a}
.tile.t-C{border-top:6px solid #4a9be0}.tile.t-Q{border-top:6px solid #9b78d6}.tile.t-G{border-top:6px solid #e5c22f}.tile.t-n{border-top:6px solid #8cc56c}
.tile.t-S,.tile.t-E{background:linear-gradient(135deg,#fff8d0,#ffe27a);border-top:6px solid #e5a800}
.tile.t-S .lb,.tile.t-E .lb{font-size:11px;color:#8a5a00}
.tile .sl{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:#22313a;color:#fff;font-size:9px;font-weight:800;padding:0 7px;border-radius:999px;white-space:nowrap;z-index:1}
.tile.lit{transform:translateZ(14px);box-shadow:0 14px 0 rgba(0,0,0,.25),0 0 0 4px #ffd34d,0 0 26px 6px #fff3a8}
.tile.next{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 3px rgba(255,255,255,.9)}
.center{grid-area:2/2/9/9;position:relative;transform-style:preserve-3d;border-radius:20px;background:radial-gradient(ellipse at 50% 40%,#9be07a,#6cbf55 70%,#58a845);box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.pond{position:absolute;left:8%;bottom:10%;width:34%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#9fe0ff,#3a9bd6 70%);box-shadow:inset 0 -6px 0 rgba(0,40,80,.25)}
.pond::after{content:"";position:absolute;inset:18%;border:2px solid rgba(255,255,255,.5);border-radius:50%;animation:ripple 3s infinite}
.fieldp{position:absolute;right:7%;bottom:12%;width:34%;height:26%;border-radius:12px;background:repeating-linear-gradient(90deg,#7a5130 0 10px,#5e3d22 10px 20px);box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.ctitle{position:absolute;left:0;right:0;top:9%;text-align:center;font-weight:800;color:#fff;font-size:30px;line-height:1.15;text-shadow:0 3px 0 #2e7d32,0 0 12px rgba(0,0,0,.25)}
.ctitle small{display:block;font-size:15px;opacity:.95}
.cseason{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(255,255,255,.9);border-radius:999px;padding:4px 18px;font-weight:800;font-size:20px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.bb{position:absolute;transform-style:preserve-3d}
.bb>.up{transform-origin:50% 100%;transform:rotateZ(calc(-1 * var(--rz))) rotateX(calc(-1 * var(--rx)));font-size:var(--fs,34px);line-height:1;filter:drop-shadow(0 4px 2px rgba(0,0,0,.25))}
.bb.sway>.up{animation:sway 3s ease-in-out infinite alternate}
/* コマ */
.pawn{position:absolute;width:0;height:0;transform-style:preserve-3d}
.pawn .psh{position:absolute;width:30px;height:14px;left:-15px;top:-7px;border-radius:50%;background:rgba(0,0,0,.3)}
.pawn .pst{position:absolute;left:-18px;bottom:0;width:36px;transform-origin:50% 100%;transform:rotateZ(calc(-1 * var(--rz))) rotateX(calc(-1 * var(--rx)));transform-style:preserve-3d}
.pawn .phop{display:flex;flex-direction:column;align-items:center}
.pawn .pbody{width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 -4px 0 rgba(0,0,0,.08);position:relative}
.pawn .pbody b{position:absolute;right:-8px;top:-8px;background:var(--c);color:#fff;border-radius:50%;width:17px;height:17px;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.pawn .pbase{width:26px;height:13px;margin-top:-3px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 60%,#000));clip-path:polygon(22% 0,78% 0,100% 100%,0 100%);border-radius:0 0 6px 6px}
.pawn.cur .pbody{box-shadow:0 0 0 4px #fff,0 0 16px 6px var(--c)}
.pawn.cur .phop{animation:bob .8s ease-in-out infinite alternate}
.pawn.hop .phop{animation:hop .26s ease-out}
.pawn.out{filter:grayscale(1);opacity:.45}
/* サイド */
.side .turn{background:#fff;border-radius:18px;padding:12px 14px;border:5px solid;box-shadow:0 6px 0 rgba(30,60,80,.12);margin-bottom:10px;text-align:center}
.tname{font-size:1.25rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.tsub{color:var(--sub);font-size:.9rem;margin-bottom:8px}
#roll{width:100%;font-size:1.25rem;padding:14px;background:linear-gradient(#ff9f2e,#ff7a1a);box-shadow:0 6px 0 #c4520a}
#roll:not(:disabled){animation:pulse 1.4s infinite}
.hand{margin-top:10px;text-align:left}
.cardc{display:flex;gap:8px;align-items:center;background:#eef6fd;border:2px solid #9cc8ef;border-radius:10px;padding:5px 10px;margin-top:6px;font-weight:700;font-size:.9rem}
.cardc span{font-size:1.25rem}.cardc.new{animation:glow 1.2s 2}
.plist{background:#fff;border-radius:18px;padding:8px 10px;box-shadow:0 6px 0 rgba(30,60,80,.12)}
.pr{display:grid;grid-template-columns:26px 22px 1fr 64px 22px 36px 18px;gap:5px;align-items:center;padding:4px 2px;border-bottom:1px dashed var(--line);font-size:.86rem}
.pr:last-child{border-bottom:none}
.pr.now{background:#fffbea;border-radius:8px}.pr.out{opacity:.5}
.pr .pn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.hpbar{height:10px;background:#e6edf0;border-radius:999px;overflow:hidden}.hpbar i{display:block;height:100%;transition:width .6s}
/* サイコロ */
.diceov{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(10,20,40,.25)}
.diceov.hidden{display:none}
.dscene{width:120px;height:120px;perspective:600px;animation:throw .9s cubic-bezier(.3,.7,.4,1) both}
.cube{position:relative;width:120px;height:120px;transform-style:preserve-3d}
.face{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#e9edf1);border-radius:20px;border:3px solid #cfd8de;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16px;box-shadow:inset 0 0 12px rgba(0,0,0,.12)}
.face i{width:22px;height:22px;border-radius:50%;background:#22313a;margin:auto;visibility:hidden}
.face.f1 i{background:#e0362c}
.f1{transform:translateZ(60px)}.f6{transform:rotateY(180deg) translateZ(60px)}.f3{transform:rotateY(90deg) translateZ(60px)}
.f4{transform:rotateY(-90deg) translateZ(60px)}.f2{transform:rotateX(90deg) translateZ(60px)}.f5{transform:rotateX(-90deg) translateZ(60px)}
.dres{position:absolute;font-size:110px;font-weight:800;color:#fff;text-shadow:0 6px 0 #ff7a1a,0 0 30px rgba(0,0,0,.4);animation:starpop .5s both}
/* モーダル */
.ov{position:fixed;inset:0;background:rgba(20,30,40,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.hidden{display:none}
.mbox{background:#fff;border-radius:22px;padding:20px 24px;max-width:620px;width:100%;text-align:center;border:5px solid #9cc8ef;box-shadow:0 12px 40px rgba(0,0,0,.3);animation:zoomin .35s cubic-bezier(.2,.9,.3,1.3) both}
.mbox.warn{border-color:#f08a3a}.mbox.good{border-color:#4cc38a}.mbox.quiz{border-color:#9b78d6}
.mbox.dark{background:radial-gradient(circle at 50% 0,#3d4340,#141716);color:#eee;border-color:#555}
.micon{font-size:64px;line-height:1.2;animation:starpop .5s both}
.mbox h2{font-size:1.4rem;margin:6px 0 10px}
.mbody{font-size:1.05rem}
.memo{font-size:.92rem;color:var(--sub);background:#f4f7f9;border-radius:10px;padding:8px 12px;text-align:left;margin:10px 0 0}
.mbox.dark .memo{background:rgba(255,255,255,.08);color:#ccd}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.mbtns button{width:100%}
.mbtns.choices button{background:#fff;color:var(--ink);border:3px solid #b79ee0;box-shadow:0 4px 0 #d9ccf0;text-align:left}
.ng{color:var(--bad);font-weight:800}
.bigcard{width:220px;height:300px;margin:6px auto 4px;perspective:900px}
.bigcard .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip 1s .2s cubic-bezier(.3,.8,.3,1.1) both}
.bigcard .bk,.bigcard .fr{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bigcard .bk{background:repeating-linear-gradient(45deg,#2a9fc9 0 12px,#1f8a57 12px 24px);color:#fff;font-size:70px;border:6px solid #fff}
.bigcard .fr{background:linear-gradient(160deg,#ffffff,#e8f4ff);border:6px solid #4a9be0;transform:rotateY(180deg);padding:14px}
.bigcard .fr .ci{font-size:80px;line-height:1.1}.bigcard .fr .cn{font-weight:800;font-size:1.2rem;margin-top:8px}
.bigcard .fr .ct{font-size:.75rem;color:#4a9be0;font-weight:800;letter-spacing:.1em}
/* 演出 */
.fxl{position:fixed;inset:0;pointer-events:none;z-index:44;overflow:hidden}
.tint{position:fixed;inset:0;pointer-events:none;z-index:43;opacity:0}
.tint.on{animation:tint var(--d,1.6s) ease both}
.pt{position:absolute;line-height:1;will-change:transform}
.pt.fall{animation:fallp var(--d) linear var(--dl) both}
.pt.rain{width:2px;height:22px;background:linear-gradient(transparent,rgba(220,235,255,.95));animation:rainf var(--d) linear var(--dl) both}
.pt.rise{animation:risep var(--d) ease-out var(--dl) both}
.pt.crawl{animation:crawl var(--d) linear var(--dl) both}
.pt.burst{left:50%;top:50%;animation:burst var(--d) cubic-bezier(.2,.8,.3,1) var(--dl) both}
.pt.drift{animation:drift var(--d) ease-in-out var(--dl) both}
.amb{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.amb .pt{animation-iteration-count:infinite!important;opacity:.85}
.amb .pt.rain{opacity:.55}
.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:46}
.banner div{background:#fff;padding:14px 46px;border-radius:22px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.2);animation:banner 1.5s cubic-bezier(.2,.8,.3,1) both;border:5px solid var(--c,#23905c)}
.banner b{display:block;font-size:2rem;color:var(--c,#23905c);line-height:1.3}
.banner small{font-size:1rem;color:var(--sub)}
.shake{animation:hit .55s}
.gray{filter:grayscale(.85) brightness(.85);transition:filter .6s}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fallc linear forwards;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}th{background:#eef5f1}
tr.outr td{color:var(--sub)}
.qcard{border:4px solid #f0c64a;background:linear-gradient(180deg,#fffbea,#fff)}
.qcard li{margin-bottom:6px;font-size:1.05rem}
.trophy{font-size:90px;display:inline-block;animation:spinY 2.4s ease-in-out infinite}
footer{text-align:center;color:#eaf6ff;font-size:.8rem;padding:8px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(8px)}to{opacity:1;transform:none}}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-26px) scale(1.05)}100%{transform:translateY(0)}}
@keyframes sway{from{transform:rotateZ(calc(-1 * var(--rz))) rotateX(calc(-1 * var(--rx))) rotate(-4deg)}to{transform:rotateZ(calc(-1 * var(--rz))) rotateX(calc(-1 * var(--rx))) rotate(4deg)}}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.15);opacity:0}}
@keyframes pulse{0%,100%{transform:none}50%{transform:scale(1.04)}}
@keyframes glow{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px #ffd34d,0 0 14px #ffd34d}}
@keyframes throw{0%{transform:translate(-55vw,40vh) scale(.5) rotate(-90deg)}70%{transform:translate(0,-30px) scale(1.15)}85%{transform:translate(0,8px) scale(.95)}100%{transform:none}}
@keyframes starpop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes flip{from{transform:rotateY(0) scale(.6)}to{transform:rotateY(180deg) scale(1)}}
@keyframes tint{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@keyframes fallp{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(var(--r,360deg))}}
@keyframes rainf{from{transform:translate(0,-12vh) rotate(12deg)}to{transform:translate(-18vw,112vh) rotate(12deg)}}
@keyframes risep{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-70vh) scale(1.2);opacity:0}}
@keyframes crawl{from{transform:translateX(-12vw)}to{transform:translateX(112vw)}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
@keyframes drift{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
@keyframes banner{0%{transform:translateX(-110vw) skewX(-12deg)}22%{transform:translateX(0) skewX(0)}75%{transform:translateX(0);opacity:1}100%{transform:translateX(110vw) skewX(12deg);opacity:0}}
@keyframes hit{0%,100%{transform:none}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,0)}}
@keyframes fallc{to{transform:translateY(112vh) rotate(760deg)}}
@keyframes spinY{0%,100%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>🎲 いのちを育てる1年 すごろく</h1><button class="hbtn" id="snd" type="button">🔇 効果音オフ</button></header>
<main id="app"></main>
<div id="tint" class="tint"></div>
<div id="fxl" class="fxl"></div>
<div id="diceov" class="diceov hidden"><div class="dscene" id="dscene"><div class="cube" id="cube"></div></div></div>
<div id="modal" class="ov hidden"><div id="mwrap"></div></div>
<footer>いのちを育てる1年すごろく ／ © Irie Kanji</footer>
<script>
/* ===== データ ===== */
const COLORS=['#e74c3c','#2e86de','#27ae60','#f39c12','#8e44ad','#16a085','#d35400'];
const SEASONS=['','春','梅雨','夏','秋','冬'];
const SICON=['','🌸','☔','☀️','🍁','❄️'];
const SCOL=['','#ffe6ee','#dfeefc','#fff1bf','#ffe2c7','#eaf1f7'];
const BT=['S','n','C','T','Q','G','T', 'C','T','n','Q','T','G', 'T','C','T','Q','n','T','G', 'C','T','Q','T','n','G', 'T','C','T','Q','T','E'];
const N=BT.length;
const SEA=i=>i<=6?1:i<=12?2:i<=19?3:i<=25?4:5;
const TYPE={S:['🚩','スタート'],E:['🏆','収穫！'],T:['⚡','トラブル'],C:['🃏','くふう'],Q:['❓','クイズ'],G:['🌞','ラッキー'],n:['🌿','']};
const SUBJ={
 tomato:{name:'ミニトマト',icon:'🍅',
  cards:{shichu:{n:'支柱・誘引',i:'🪵',m:'茎を支柱にしばると、風で倒れたり折れたりするのを防げる。'},
   mimawari:{n:'見回り・防除',i:'🔍',m:'毎日観察して、病気や害虫を早く見つけて対処する。'},

/* ===== サイコロ ===== */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE_ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]};
$('cube').innerHTML=[1,2,3,4,5,6].map(n=>`<div class="face f${n}">${Array.from({length:9},(_,i)=>`<i style="visibility:${PIPS[n].includes(i)?'visible':'hidden'}"></i>`).join('')}</div>`).join('');
async function rollDice(n){const ov=$('diceov'),cube=$('cube'),sc=$('dscene');ov.classList.remove('hidden');sfx('roll');
 sc.style.animation='none';void sc.offsetWidth;sc.style.animation='';
 cube.style.transition='none';cube.style.transform='rotateX(0) rotateY(0)';void cube.offsetWidth;
 const[x,y]=FACE_ROT[n];cube.style.transition=RM?'none':'transform 1.25s cubic-bezier(.2,.75,.25,1.05)';
 cube.style.transform=`rotateX(${x+1080}deg) rotateY(${y+720}deg)`;
 await sleep(RM?100:1350);const r=document.createElement('div');r.className='dres';r.textContent=n;ov.appendChild(r);sfx('hop');
 await sleep(650);r.remove();ov.classList.add('hidden');}

/* ===== モーダル ===== */
function modal({icon,title,body,cls,buttons,choices}){return new Promise(res=>{const ov=$('modal');
 $('mwrap').innerHTML=`<div class="mbox ${cls||''}">${icon?`<div class="micon">${icon}</div>`:''}<h2>${title}</h2><div class="mbody">${body||''}</div><div class="mbtns ${choices?'choices':''}">${buttons.map((b,i)=>`<button data-b="${i}" class="${b.cls||''}">${b.label}</button>`).join('')}</div></div>`;
 ov.classList.remove('hidden');
 $('mwrap').querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>{ov.classList.add('hidden');res(buttons[+el.dataset.b].v);});});}

/* ===== 準備画面 ===== */
let setup={n:4,pl:[]};
for(let i=0;i<7;i++)setup.pl[i]={name:'',subj:['tomato','madai','hen'][i%3]};
function renderSetup(){
 app.innerHTML=`<div class="card hero"><div class="icons"><span>🎲</span><span>🍅</span><span>🐟</span><span>🐔</span></div><h2>いのちを育てる1年 すごろく</h2>
 <p>春から冬までの1年間、生き物を育てながらゴール（収穫）を目指そう！<br>トラブルを防ぐ「くふうカード」を、どこで使うかがポイントです。</p></div>
 <div class="card"><h2>① 人数を選ぶ</h2><div class="row">${[2,3,4,5,6,7].map(n=>`<button class="nbtn ${n===setup.n?'sel':''}" data-n="${n}">${n}人</button>`).join('')}</div></div>
 <div class="card"><h2>② 名前と、育てる生き物を選ぶ</h2>${setup.pl.slice(0,setup.n).map((p,i)=>`<div class="prow"><span class="dot" style="background:${COLORS[i]}">${i+1}</span>
  <input data-i="${i}" value="${esc(p.name)}" placeholder="プレイヤー${i+1}" maxlength="10">
  ${Object.entries(SUBJ).map(([k,S])=>`<button class="sb ${p.subj===k?'sel':''}" data-i="${i}" data-k="${k}">${S.icon} ${S.name}</button>`).join('')}</div>`).join('')}
  <div style="margin-top:14px"><button id="start" class="big">🎲 ゲームスタート！</button></div></div>
 <div class="card"><h2>📖 ルール</h2><ul class="rules">
  <li>順番にサイコロをふって進みます。盤面は春から冬までの1年間（1周）です。</li>
  <li><b>⚡ トラブル</b>：元気が減ります。合う「くふうカード」を持っていれば防げます。</li>
  <li><b>🃏 くふう</b>：くふうカードを1枚もらえます。カードは<b>${HAND}枚まで</b>。使うとなくなります。</li>
  <li><b>❓ クイズ</b>：班で相談してOK。正解すると元気が1回復します。</li>
  <li><b>🌞 ラッキー</b>：よいことが起こります。</li>
  <li>元気（最大${MAXHP}）が0になると、そこで育成は終わりです。ゴールで残った元気が多いほど、たくさん収穫できます。</li>
  <li>カードをいつ使うか、取っておくか。班のみんなで相談しよう！</li></ul></div>`;
 app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{setup.n=+b.dataset.n;renderSetup();});
 app.querySelectorAll('input[data-i]').forEach(el=>el.oninput=()=>{setup.pl[+el.dataset.i].name=el.value.trim();});
 app.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{setup.pl[+b.dataset.i].subj=b.dataset.k;renderSetup();});
 $('start').onclick=startGame;window.scrollTo(0,0);}

/* ===== ゲーム ===== */
let P=[],cur=0,busy=false,order=[];
async function startGame(){
 P=setup.pl.slice(0,setup.n).map((p,i)=>{const S=SUBJ[p.subj];return{name:p.name||`プレイヤー${i+1}`,subj:p.subj,color:COLORS[i],pos:0,hp:MAXHP,hand:[draw(S),draw(S)],done:false,out:false,log:[],qs:[]};});
 cur=0;busy=false;order=[];ambSeason=0;renderGame();
 await banner('🌸 春がやってきた！','1年間の育成スタート','#e86a92',1600);turnIntro();}
const DECO=[{e:'🌳',x:4,y:30,fs:42,sw:1},{e:'🌳',x:88,y:28,fs:36,sw:1},{e:'🏡',x:72,y:52,fs:44},{e:'🐔',x:48,y:66,fs:30,sw:1},{e:'🌾',x:77,y:78,fs:28,sw:1},{e:'🍅',x:88,y:80,fs:26,sw:1},{e:'⛵',x:18,y:76,fs:28,sw:1},{e:'🐟',x:28,y:86,fs:22,sw:1},{e:'🌻',x:58,y:86,fs:26,sw:1}];
function renderGame(){
 app.innerHTML=`<div class="game"><div class="stage" id="stage"><div class="amb" id="amb"></div><div class="bscale" id="bscale"><div class="board" id="board">
 ${BT.map((t,i)=>{const[r,c]=cell(i),se=SEA(i),first=i===0||SEA(i-1)!==se;return`<div class="tile t-${t}" id="sq${i}" style="grid-row:${r+1};grid-column:${c+1};--sc:${SCOL[se]}"><span class="no">${i}</span><span class="ic">${TYPE[t][0]}</span><span class="lb">${TYPE[t][1]}</span>${first&&i!==0?`<span class="sl">${SICON[se]}${SEASONS[se]}</span>`:''}</div>`;}).join('')}
 <div class="center"><div class="pond"></div><div class="fieldp"></div><div class="ctitle">いのちを育てる1年<small>🍅 🐟 🐔</small></div><div class="cseason" id="cseason"></div>
 ${DECO.map(d=>`<div class="bb ${d.sw?'sway':''}" style="left:${d.x}%;top:${d.y}%;--fs:${d.fs}px"><div class="up">${d.e}</div></div>`).join('')}</div>
 </div></div></div><div class="side" id="side"></div></div>`;
 fitBoard();renderTokens();renderSide();window.scrollTo(0,0);}
function fitBoard(){const st=$('stage'),bs=$('bscale');if(!st||!bs)return;const s=Math.min(st.clientWidth/700,st.clientHeight/630,1.25);bs.style.transform=`scale(${s})`;}
addEventListener('resize',fitBoard);
function renderTokens(hopIdx){document.querySelectorAll('.pawn').forEach(e=>e.remove());const cnt={};
 P.forEach((p,i)=>{const t=$('sq'+p.pos);if(!t)return;const k=cnt[p.pos]=(cnt[p.pos]||0)+1;const ox=[50,28,72,40,62,22,78][k-1],oy=[62,52,52,78,78,72,72][k-1];
  t.insertAdjacentHTML('beforeend',`<div class="pawn ${i===cur&&!p.done&&!p.out?'cur':''} ${p.out?'out':''} ${hopIdx===i?'hop':''}" style="left:${ox}%;top:${oy}%;--c:${p.color}"><div class="psh"></div><div class="pst"><div class="phop"><div class="pbody">${SUBJ[p.subj].icon}<b>${i+1}</b></div><div class="pbase"></div></div></div></div>`);});}
const hpCol=h=>h>=7?'#27ae60':h>=4?'#e08a1e':'#c0392b';
function cardHtml(S,c,isNew){const k=S.cards[c];return`<div class="cardc ${isNew?'new':''}" title="${esc(k.m)}"><span>${k.i}</span>${k.n}</div>`;}
function renderSide(newCard){const p=P[cur],S=SUBJ[p.subj],se=SEA(p.pos);
 $('side').innerHTML=`<div class="turn" style="border-color:${p.color}"><div class="tname"><span class="dot" style="background:${p.color}">${cur+1}</span>${esc(p.name)}さんの番</div>
 <div class="tsub">${S.icon} ${S.name} ・ ${SICON[se]} ${SEASONS[se]} ・ 元気 <b>${p.hp}</b>/${MAXHP}</div>
 <button id="roll" ${busy?'disabled':''}>🎲 サイコロをふる</button>
 <div class="hand" id="hand"><b>🃏 くふうカード（${p.hand.length}/${HAND}）</b>${p.hand.map((c,i)=>cardHtml(S,c,newCard&&i===p.hand.length-1)).join('')||'<div class="small">まだありません</div>'}</div></div>
 <div class="plist">${P.map((q,i)=>`<div class="pr ${i===cur?'now':''} ${q.out?'out':''}"><span class="dot" style="background:${q.color}">${i+1}</span><span>${SUBJ[q.subj].icon}</span><span class="pn">${esc(q.name)}</span><span class="hpbar"><i style="width:${q.hp*100/MAXHP}%;background:${hpCol(q.hp)}"></i></span><span><b>${q.hp}</b></span><span>🃏${q.hand.length}</span><span>${q.done?'🏁':q.out?'💤':''}</span></div>`).join('')}</div>`;
 $('roll').onclick=roll;const cs=$('cseason');if(cs)cs.textContent=`${SICON[se]} ${SEASONS[se]} ｜ ${esc(p.name)}さんの番`;setAmbient(se);}
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&$('roll')&&!$('roll').disabled&&$('modal').classList.contains('hidden')){e.preventDefault();roll();}});
async function turnIntro(){const p=P[cur];renderTokens();renderSide();await banner(`${SUBJ[p.subj].icon} ${esc(p.name)}さんの番！`,`${SICON[SEA(p.pos)]} ${SEASONS[SEA(p.pos)]}・元気 ${p.hp}`,p.color,1200);}
async function roll(){if(busy)return;busy=true;const p=P[cur];$('roll').disabled=true;
 const n=1+rand(6);await rollDice(n);
 const se0=SEA(p.pos);
 for(let k=0;k<n&&p.pos<N-1;k++){p.pos++;renderTokens(cur);sfx('hop');await sleep(RM?60:300);}
 const sq=$('sq'+p.pos);sq.classList.add('lit');
 const se1=SEA(p.pos);if(se1!==se0&&p.pos<N-1){renderSide();particles(AMB[se1].kind==='rain'?{kind:'rain',n:40,d:1}:{...AMB[se1],kind:'fall',n:24,d:3,spread:1});await banner(`${SICON[se1]} ${SEASONS[se1]}がやってきた！`,`${esc(p.name)}さんの${SUBJ[p.subj].name}`,'#2a9fc9',1400);}
 await sleep(300);
 await land(p);sq.classList.remove('lit');busy=false;await nextTurn();}
async function nextTurn(){if(P.every(q=>q.done||q.out)){finish();return;}
 do{cur=(cur+1)%P.length;}while(P[cur].done||P[cur].out);await turnIntro();}

async function land(p){const t=BT[p.pos],S=SUBJ[p.subj];
 if(t==='E'){p.done=true;order.push(p);renderSide();sfx('fan');confetti(70);particles({kind:'burst',e:['🎉','✨','⭐','🎊'],n:24,d:1.4,fs:34});
  await modal({icon:'<span class="trophy">🏆</span>',cls:'good',title:`${esc(p.name)}さん、収穫！`,body:`${S.icon} ${S.harvest(p.hp)}<br>のこった元気：<b>${p.hp}</b>`,buttons:[{label:'次の人へ ▶',v:1}]});return;}
 if(t==='T')return trouble(p,S);
 if(t==='C')return getCard(p,S,'🃏','くふうマス','くふうカードを1枚手に入れた！');
 if(t==='Q')return quiz(p,S);
 if(t==='G')return lucky(p,S);
 particles({kind:'drift',e:['🌿','🍀'],n:6,d:1.4,fs:26});await banner('🌿 順調に育っています','',p.color,1000);}

async function trouble(p,S){const se=SEA(p.pos);let pool=S.tr.filter(x=>x.s.includes(se));const fresh=pool.filter(x=>!p.log.some(l=>l.n===x.n));if(fresh.length)pool=fresh;
 const tr=pool[rand(pool.length)],have=[...new Set(p.hand.filter(c=>tr.c.includes(c)))],need=tr.c.map(c=>`${S.cards[c].i} ${S.cards[c].n}`).join('、');
 await troubleFx(tr.n);
 if(have.length){
  const v=await modal({icon:'⚡',cls:'warn',title:`${S.icon} ${tr.n}`,body:`このままだと <b class="ng">元気 −${tr.d}</b><br>持っているカードで防げます！ 使いますか？<p class="small">カードは使うとなくなります。この先のトラブルのために、取っておくこともできます。班で相談しよう。</p>`,
   buttons:[...have.map(c=>({label:`${S.cards[c].i} ${S.cards[c].n}を使う`,v:c})),{label:`使わない（元気 −${tr.d}）`,v:'',cls:'sub'}]});
  if(v){p.hand.splice(p.hand.indexOf(v),1);p.log.push({n:tr.n,ok:true,card:S.cards[v].n});renderSide();sfx('good');
   particles({kind:'burst',e:['🛡️','✨','💚'],n:18,d:1.2,fs:34});tint('rgba(80,220,140,.28)',1200);
   await modal({icon:'🛡️',cls:'good',title:'防げました！',body:`${S.cards[v].i} <b>${S.cards[v].n}</b>で、「${tr.n}」を防ぎました。<p class="memo">技術メモ：${tr.m}</p>`,buttons:[{label:'次の人へ ▶',v:1}]});return;}}
 p.hp=Math.max(0,p.hp-tr.d);p.log.push({n:tr.n,ok:false,need});renderSide();
 if(p.hp<=0){p.out=true;renderTokens();renderSide();$('stage').classList.add('gray');
  await modal({cls:'dark',title:`${esc(p.name)}さんの${S.name}は、育成をつづけられなくなりました`,body:`原因：${tr.n}<p class="memo">技術メモ：${tr.m}<br>防ぐには：${need}</p><p style="font-size:.92rem">命を預かる仕事では、ひとつひとつの判断が結果につながります。何があれば防げたか、考えてみよう。</p>`,buttons:[{label:'次の人へ ▶',v:1}]});
  $('stage').classList.remove('gray');return;}
 await modal({icon:'⚡',cls:'warn',title:`${S.icon} ${tr.n}`,body:`<b class="ng">元気 −${tr.d}</b>（のこり ${p.hp}）<p class="memo">技術メモ：${tr.m}<br>防ぐには：${need}</p>`,buttons:[{label:'次の人へ ▶',v:1}]});}

async function getCard(p,S,icon,title,msg){const c=draw(S),k=S.cards[c];sfx('card');
 const big=`<div class="bigcard"><div class="in"><div class="bk">🃏</div><div class="fr"><div class="ct">くふうカード</div><div class="ci">${k.i}</div><div class="cn">${k.n}</div></div></div></div><p class="memo">${k.m}</p>`;
 if(p.hand.length<HAND){
  await modal({icon,cls:'',title,body:`${msg}${big}`,buttons:[{label:'手札に加える ▶',v:1}]});p.hand.push(c);renderSide(true);particles({kind:'burst',e:['✨'],n:10,d:.9,fs:24});await sleep(600);return;}
 const all=[...p.hand,c];
 const v=await modal({icon,cls:'',title,body:`${msg}${big}カードは${HAND}枚までです。<b>1枚すてるカード</b>を選ぼう。`,
  buttons:all.map((x,i)=>({label:`${S.cards[x].i} ${S.cards[x].n}をすてる${i===all.length-1?'（新しいカード）':''}`,v:i,cls:'sub'}))});
 all.splice(v,1);p.hand=all;renderSide(v!==all.length);}

async function quiz(p,S){let pool=S.quiz.map((q,i)=>i).filter(i=>!p.qs.includes(i));if(!pool.length){p.qs=[];pool=S.quiz.map((q,i)=>i);}
 const qi=pool[rand(pool.length)],q=S.quiz[qi];p.qs.push(qi);
 const idx=q.a.map((a,i)=>i).sort(()=>Math.random()-.5);
 const v=await modal({icon:'❓',cls:'quiz',choices:true,title:q.q,body:'<span class="small">班で相談してOK！</span>',buttons:idx.map(i=>({label:q.a[i],v:i}))});
 const ok=v===q.k;if(ok){p.hp=Math.min(MAXHP,p.hp+1);renderSide();sfx('good');particles({kind:'burst',e:['⭕','✨','💯'],n:16,d:1.2,fs:32});}else{sfx('bad');shake();}
 await modal({icon:ok?'⭕':'❌',cls:ok?'good':'quiz',title:ok?'正解！ 元気 +1':'ざんねん…',body:`答え：<b>${q.a[q.k]}</b><p class="memo">${q.m}</p>`,buttons:[{label:'次の人へ ▶',v:1}]});}

async function lucky(p,S){const e=LUCKY[rand(LUCKY.length)];
 if(e.card)return getCard(p,S,e.i,e.t,e.m);
 p.hp=Math.min(MAXHP,p.hp+e.h);renderSide();sfx('good');tint('rgba(255,230,120,.35)',1400);particles({kind:'burst',e:['✨','🌟',e.i],n:22,d:1.3,fs:32});
 await modal({icon:e.i,cls:'good',title:`${e.t} 元気 +${e.h}`,body:e.m,buttons:[{label:'次の人へ ▶',v:1}]});}

/* ===== 結果 ===== */
function finish(){const fin=[...order].sort((a,b)=>b.hp-a.hp||order.indexOf(a)-order.indexOf(b)),outs=P.filter(p=>p.out);
 app.innerHTML=`<div class="card hero"><div class="trophy">🏆</div><h2>1年間の育成が終わりました</h2></div>
 <div class="card"><h2>🏆 結果</h2><table><tr><th>順位</th><th>名前</th><th>育てた生き物</th><th>のこった元気</th><th>収穫</th></tr>
 ${fin.map((p,i)=>`<tr><td><b>${['🥇','🥈','🥉'][i]||''} ${i+1}位</b></td><td><span class="dot" style="background:${p.color};width:20px;height:20px"></span> ${esc(p.name)}</td><td>${SUBJ[p.subj].icon} ${SUBJ[p.subj].name}</td><td>${p.hp}</td><td>${SUBJ[p.subj].harvest(p.hp)}</td></tr>`).join('')}
 ${outs.map(p=>`<tr class="outr"><td>—</td><td>${esc(p.name)}</td><td>${SUBJ[p.subj].icon} ${SUBJ[p.subj].name}</td><td>0</td><td>育成をつづけられなかった</td></tr>`).join('')}</table></div>
 <div class="card"><h2>⚡ 出会ったトラブルと「くふう」</h2><table><tr><th>名前</th><th>防げたトラブル（使ったカード）</th><th>防げなかったトラブル（防ぐには）</th></tr>
 ${P.map(p=>`<tr><td>${SUBJ[p.subj].icon} ${esc(p.name)}</td><td>${p.log.filter(l=>l.ok).map(l=>`${l.n}（${l.card}）`).join('<br>')||'—'}</td><td>${p.log.filter(l=>!l.ok).map(l=>`${l.n}（${l.need}）`).join('<br>')||'—'}</td></tr>`).join('')}</table></div>
 <div class="card qcard"><h2>✏️ ふりかえろう</h2><ol><li>いちばん困ったトラブルは何だった？</li><li>役に立った「くふう」は何？ なぜ防げたのだろう？</li><li>生き物を育てる人は、何を知っていて、何を工夫しているのだろう？ 気になったことを「問い」にして付箋に書こう。</li></ol></div>
 <div class="row" style="justify-content:center;margin-bottom:20px"><button id="again" class="big">🎲 同じメンバーでもう一度</button><button class="sub" id="reset">メンバーを変える</button></div>`;
 sfx('fan');confetti(90);particles({kind:'burst',e:['🎉','✨','🎊','⭐'],n:30,d:1.6,fs:36});
 $('again').onclick=startGame;$('reset').onclick=renderSetup;window.scrollTo(0,0);}

renderSetup();
</script>
</body>
</html>
